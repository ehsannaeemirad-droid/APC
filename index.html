<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<title>سامانه هوشمند مدیریت موجودی و تأمین — پتروشیمی آبادان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f3f9;--card:#fff;--bd:#e2e8f0;--bd2:#cbd5e1;--tx:#0f172a;--t2:#334155;--mu:#64748b;--mu2:#94a3b8;--p:#1e40af;--p2:#3b82f6;--gold:#b45309;--gold2:#f59e0b;--crit:#e11d48;--critbg:#fff1f2;--high:#ea580c;--highbg:#fff7ed;--med:#ca8a04;--medbg:#fefce8;--good:#059669;--goodbg:#ecfdf5;--info:#0284c7;--infobg:#f0f9ff;--track:#e8eef5;--th:#f8fafc;--shadow:0 4px 14px -4px rgba(15,23,42,.1);--r:12px;--hdr1:#070d1c;--hdr2:#0f172a;--hdr3:#1e3a8a}
[data-theme="dark"]{--bg:#0a0e17;--card:#151c28;--bd:#243044;--bd2:#334155;--tx:#e8eef7;--t2:#b8c5d6;--mu:#8896a8;--mu2:#5a6878;--p:#60a5fa;--p2:#93c5fd;--gold:#fbbf24;--gold2:#fcd34d;--crit:#fb7185;--critbg:#3f1520;--high:#fdba74;--highbg:#3d2515;--med:#fcd34d;--medbg:#3d3215;--good:#34d399;--goodbg:#0f2a22;--info:#7dd3fc;--infobg:#122433;--track:#1e293b;--th:#1a2332;--hdr1:#050810;--hdr2:#0a0e17;--hdr3:#111827}
[data-theme="sand"]{--bg:#f7f1e8;--card:#fffdf9;--bd:#e8dcc8;--bd2:#d4c4a8;--tx:#1c1410;--t2:#4a3f35;--mu:#7a6b5d;--mu2:#a89880;--p:#9a3412;--p2:#c2410c;--gold:#a16207;--gold2:#ca8a04;--crit:#b91c1c;--critbg:#fef2f2;--high:#c2410c;--highbg:#fff7ed;--med:#a16207;--medbg:#fefce8;--good:#166534;--goodbg:#f0fdf4;--info:#075985;--infobg:#f0f9ff;--track:#efe6d8;--th:#faf6f0;--hdr1:#1c1410;--hdr2:#292018;--hdr3:#7c2d12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.has-tip{border-bottom:1px dashed var(--mu2);cursor:help}
#tipBox{position:fixed;z-index:9000;max-width:min(320px,88vw);background:#0f172a;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.7;opacity:0;pointer-events:none;transition:.15s;text-align:right}
#tipBox.on{opacity:1}
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#070d1c,#0f172a 50%,#1e3a8a);display:flex;align-items:center;justify-content:center;padding:20px}
#lock.hid{display:none!important}
.lock-box{background:#fff;border-radius:18px;padding:26px 22px;width:min(400px,100%);text-align:center}
.lock-box img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:10px;background:#0f172a}
.lock-box h1{font-size:15px;font-weight:800;color:#0f172a;margin-bottom:4px}
.lock-box .sub{font-size:11.5px;color:#64748b;margin-bottom:16px}
.lock-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock-mode{border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 10px}
.lock-mode:hover{border-color:#3b82f6}
.lock-mode b{display:block;font-size:13px}.lock-mode span{font-size:10.5px;color:#64748b}
.lock-pass{display:none}.lock-pass.on{display:block}
.lock-pass input{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.25em;margin:10px 0}
.lock-pass .go{width:100%;padding:12px;border-radius:10px;background:#1e40af;color:#fff;font-weight:700}
.lock-err{color:#e11d48;font-size:12px;min-height:18px;font-weight:600}
#app{display:none}#app.on{display:block}
.sample-banner{display:none;background:#fef3c7;color:#854d0e;text-align:center;padding:6px;font-size:12px;font-weight:600}
.sample-banner.on{display:block}
.header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2) 55%,var(--hdr3));color:#fff;padding:10px 16px;position:sticky;top:0;z-index:50}
.header-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover}
.brand h1{font-size:14px;font-weight:800}.brand p{font-size:10px;color:#94a3b8}.brand .co{color:var(--gold2);font-weight:700}
.hdr-right{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-inline-start:auto}
.pill{font-size:10px;padding:4px 9px;border-radius:999px;font-weight:700}
.pill.g{background:rgba(16,185,129,.2);color:#34d399}.pill.n{background:rgba(148,163,184,.2);color:#cbd5e1}.pill.o{background:rgba(245,158,11,.2);color:#fbbf24}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:#94a3b8}
.seg button.on{background:var(--p2);color:#fff}
.btn{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs-wrap{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:58px;z-index:40}
.tabs{max-width:1500px;margin:0 auto;display:flex;overflow-x:auto;padding:0 12px;gap:2px}
.tab{padding:11px 12px;font-size:12.5px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--p2);border-bottom-color:var(--p2);font-weight:700}
.tab .bdg{background:var(--crit);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-right:4px}
.main{max-width:1500px;margin:0 auto;padding:14px 14px 60px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;margin-bottom:12px}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--bd2);border-radius:8px;font-size:12px;background:var(--card);min-width:100px}
.filters label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.kpi-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--shadow)}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px}
.kpi.c::before{background:var(--crit)}.kpi.h::before{background:var(--high)}.kpi.m::before{background:var(--med)}.kpi.g::before{background:var(--good)}.kpi.i::before{background:var(--info)}
.kpi .l{font-size:11.5px;color:var(--mu);font-weight:600}.kpi .v{font-size:20px;font-weight:800;margin-top:4px}.kpi .s{font-size:10.5px;color:var(--mu2);margin-top:3px}.kpi .go{font-size:10.5px;color:var(--p2);margin-top:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.st{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.st .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p2);margin-left:6px}
.st small{font-weight:500;color:var(--mu);font-size:11.5px}
.st-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-sm{padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--th);border:1px solid var(--bd);color:var(--t2)}
.btn-sm.primary{background:var(--p);color:#fff;border-color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.two{grid-template-columns:1fr}.kpi-g{grid-template-columns:repeat(2,1fr)}}
.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.chip.c{background:var(--critbg);color:var(--crit)}.chip.h{background:var(--highbg);color:var(--high)}.chip.m{background:var(--medbg);color:var(--med)}.chip.g{background:var(--goodbg);color:var(--good)}.chip.i{background:var(--infobg);color:var(--info)}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:7px;cursor:pointer}
.act:hover{background:var(--th)}.act.c{border-inline-start:3px solid var(--crit)}.act.h{border-inline-start:3px solid var(--high)}
.prio{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
.act .nm{font-weight:700;font-size:13px}.act .mt{font-size:11.5px;color:var(--mu);margin-top:2px}
.days{font-weight:800;direction:ltr;text-align:center;font-size:13px;min-width:52px}.days.bad{color:var(--crit)}.days.warn{color:var(--high)}
.tbl-w{overflow:auto;max-height:480px;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--th);padding:9px 10px;text-align:center;font-size:11px;color:var(--t2);border-bottom:1px solid var(--bd);z-index:1}
th.r,td.r{text-align:right}td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:center}
tr:hover td{background:var(--th);cursor:pointer}.num{direction:ltr;text-align:center}
.bar-r{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px}
.bar-n{width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{flex:1;height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;min-width:2px}.bar-f.r{background:var(--crit)}.bar-f.o{background:var(--high)}.bar-f.g{background:var(--good)}.bar-f.b{background:var(--info)}.bar-f.gold{background:var(--gold2)}
.gauge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto}
.gauge::after{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--card)}
.gauge span{position:relative;z-index:1;font-weight:800;font-size:17px}
.drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none}.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,94vw);background:var(--card);z-index:90;transform:translateX(-105%);transition:.25s;overflow-y:auto;padding:16px}
.drawer.on{transform:translateX(0)}
.df{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.df .f{background:var(--th);border-radius:8px;padding:8px}.df .f .lb{font-size:10px;color:var(--mu)}.df .f .vl{font-size:13px;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:min(560px,100%);max-height:85vh;border-radius:16px 16px 0 0;overflow:auto;padding:16px}
.modal h3{font-size:15px}.modal .ms{font-size:12px;color:var(--mu);margin:4px 0 12px}
.share-opts{display:grid;gap:8px;margin-top:8px}
.share-opts button{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--th);font-weight:600;text-align:right}
.share-opts button:hover{border-color:var(--p2);background:var(--infobg)}
.coll{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.coll-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:var(--th);cursor:pointer;font-weight:700;font-size:13px}
.coll-hd:hover{background:var(--bd)}
.coll-hd .chev{transition:.2s;display:inline-block}
.coll.open .coll-hd .chev{transform:rotate(90deg)}
.coll-bd{display:none;padding:10px 12px;border-top:1px solid var(--bd)}
.coll.open .coll-bd{display:block}
.empty{text-align:center;padding:20px;color:var(--mu)}
.msg{background:var(--medbg);border:1px solid var(--bd2);color:var(--gold);padding:10px;border-radius:10px;font-size:12.5px;margin-bottom:10px}
.hint{font-size:11.5px;color:var(--mu);background:var(--th);border:1px dashed var(--bd2);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sync-line{font-size:11.5px;color:var(--mu);margin-bottom:10px}
.foot{text-align:center;color:var(--mu);font-size:11px;padding:12px}
.theme-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-opt{border:2px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.theme-opt.on{border-color:var(--p2)}.theme-prev{height:36px;border-radius:6px;margin-bottom:6px}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;inset:0;padding:16px;background:#fff;color:#000}
  #printArea table{width:100%;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border:1px solid #ccc;padding:6px;text-align:right}
  #printArea h1{font-size:16px;margin-bottom:8px}
  #printArea .meta{font-size:11px;color:#555;margin-bottom:12px}
}
</style>
</head>
<body>
<div id="tipBox"></div>
<div id="printArea"></div>

</div>

      <button type="button" class="btn" id="btnSettings">تنظیمات</button>

  </div></header>
  <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
  <main class="main">
    <div class="filters" id="filters"></div>
    <div id="view"></div>
    <div class="foot">پتروشیمی آبادان · سامانه هوشمند Excel</div>
  </main>
</div>
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <button type="button" id="drawerX" style="float:left;font-size:18px">✕</button>
  <h2 id="dTitle" style="font-size:15px"></h2>
  <div id="dSub" style="font-size:12px;color:var(--mu);margin-bottom:8px"></div>
  <div id="dBody"></div>
</aside>
<div class="modal-bg" id="shareModal">
  <div class="modal">
    <button type="button" id="shareX" style="float:left">✕</button>
    <h3 id="shareTitle">خروجی و اشتراک</h3>
    <div class="ms" id="shareSub"></div>
    <div class="share-opts">
      <button type="button" id="optPrint">چاپ مستقیم</button>
      <button type="button" id="optPdf">دانلود / ذخیره به‌صورت PDF (از پنجره چاپ)</button>
      <button type="button" id="optShare">اشتراک‌گذاری (پیام‌رسان / ایمیل سیستم)</button>
      <button type="button" id="optCopy">کپی متن در کلیپ‌بورد</button>
    </div>
  </div>
</div>

function n(v){return(v==null||v===""||isNaN(Number(v)))?0:Number(v)}

function toJalali(iso){if(!iso)return"—";try{var d=new Date(iso);if(isNaN(d.getTime()))return String(iso).slice(0,10);return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}catch(e){return String(iso).slice(0,10)}}
function hoursAgo(iso){if(!iso)return null;var t=new Date(iso).getTime();if(isNaN(t))return null;return(Date.now()-t)/36e5}
function uniq(a){var o={},r=[],i;for(i=0;i<a.length;i++)if(a[i]&&!o[a[i]]){o[a[i]]=1;r.push(a[i])}return r.sort()}

    prefSup:r.PreferredSupplierCode||"",prefRisk:String(r.PreferredSupplierRiskLevel||"")};

/* Rules */
function isCritical(i){return i.stockStatus==="CRITICAL"}
/** سفارش امروز: بحرانی با نیاز سفارش، یا باید امروز سفارش شود وگرنه با Lead Time کمبود می‌شود */
function isOrderToday(i){
  if(isCritical(i)){
    if(i.qty>0||i.rec==="ORDER"||i.timing.indexOf("ORDER NOW")>=0)return true;
    return true; /* کمبود امروز — در لیست سفارش امروز هم می‌آید */
  }
  if(i.qty<=0)return false;
  if(i.timing.indexOf("ORDER NOW")>=0)return true;
  if(i.gap<0)return true;
  /* اگر پوشش ≤ lead time و پیشنهاد سفارش هست → امروز لازم است */
  if(i.avgLead>0&&i.coverage>0&&i.coverage<=i.avgLead&&i.rec==="ORDER")return true;
  if(i.rec==="ORDER"&&i.dts>0&&i.dts<=i.avgLead+7)return true;
  return false;
}
function isOverOneYear(i){return i.coverage>=365||i.dts>=365||i.monthsReceipt>=12}
function isHighRiskSup(i){return/high|crit/i.test(i.prefRisk)}
function inMonthActions(i){
  if(isOrderToday(i))return true;
  if(i.qty>0&&i.dts>0&&i.dts<=30)return true;
  if(i.stockStatus==="WARNING"&&i.dts<=30)return true;
  if(i.rec==="ORDER"&&i.qty>0&&i.dts<=45)return true;
  return false;
}
function actionMeta(i){
  var problem="",action="";
  if(isCritical(i)){problem="کمبود / موجودی بحرانی همین امروز";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))+" واحد"):"تأمین فوری"}
  else if(i.gap<0){problem="فرصت سفارش گذشته ("+fmt(Math.abs(Math.round(i.gap)))+" روز)";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"بازبینی"}
  else if(i.timing.indexOf("ORDER NOW")>=0){problem="زمان‌بندی: سفارش امروز";action="ثبت سفارش "+fmt(Math.round(i.qty))}
  else if(i.avgLead>0&&i.coverage<=i.avgLead){problem="پوشش ≤ زمان تأمین — خطر کمبود";action="سفارش "+fmt(Math.round(i.qty))}
  else if(i.dts<=30){problem="اتمام طی "+fmt(i.dts,0)+" روز";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"پایش"}
  else{problem="نیاز به سفارش";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"بررسی"}
  return{problem:problem,action:action};
}
function buildList(list,pred){
  var out=[];
  list.forEach(function(i){
    if(pred&&!pred(i))return;
    var m=actionMeta(i);
    var o={};for(var k in i)o[k]=i[k];
    o._problem=m.problem;o._action=m.action;
    o._p=isCritical(i)?5:(i.gap<0?8:(i.dts||99));
    out.push(o);
  });
  out.sort(function(a,b){return a._p-b._p||a.dts-b.dts||a.stock-b.stock});
  return out;
}
function orderCost(items){return items.reduce(function(s,i){return s+(i.qty||0)*unitCost(i)},0)}
function labStatus(s){return({CRITICAL:"بحرانی",WARNING:"هشدار",GOOD:"سالم"})[s]||s||"—"}
function labHealth(h){return({HEALTHY:"سالم",SLOW:"کم‌گردش",DEAD:"راکد"})[h]||h||"—"}
function labCrit(c){return({A:"A حیاتی",B:"B مهم",C:"C عادی"})[c]||(c||"—")}
function sev(s){s=String(s||"").toUpperCase();if(/CRIT|HIGH|DEAD/.test(s))return"c";if(/WARN|MED|SLOW/.test(s))return"h";if(/GOOD|HEALTHY|LOW/.test(s))return"g";return"i"}

function itemsToText(title,rows){
  var lines=[title,"تاریخ: "+toJalali(GEN||new Date().toISOString()),"پتروشیمی آبادان","—"];
  rows.forEach(function(i,idx){
    lines.push((idx+1)+". "+i.name+" ("+i.code+")");
    lines.push("   وضعیت: "+labStatus(i.stockStatus)+" | موجودی: "+fmt(Math.round(i.stock))+" | روز تا اتمام: "+fmt(i.dts,1));
    if(i.qty)lines.push("   سفارش پیشنهادی: "+fmt(Math.round(i.qty)));
    if(i._problem)lines.push("   "+i._problem+" → "+(i._action||""));
    if(invValue(i))lines.push("   ارزش: "+rial(invValue(i)));
    lines.push("");
  });
  if(!rows.length)lines.push("موردی نیست.");
  return lines.join("\n");
}

function tabsForMode(){
  if(MODE==="ops")return[{id:"today",label:"امروز"},{id:"plan30",label:"اقدامات ۳۰ روز"},{id:"health",label:"سلامت"},{id:"items",label:"کالاها"}];
  return[{id:"overview",label:"خلاصه مدیریتی"},{id:"finance",label:"مالی و سفارش"},{id:"suppliers",label:"تأمین‌کنندگان"},{id:"strategy",label:"ریسک"}];
}
function renderTabs(){
  var tabs=tabsForMode();
  if(TAB!=="settings"&&!tabs.some(function(t){return t.id===TAB}))TAB=tabs[0].id;
  var n=buildList(filtered(),isOrderToday).length;
  var html=tabs.map(function(t){return'<button type="button" class="tab'+(TAB===t.id?" on":"")+'" data-t="'+t.id+'">'+t.label+(t.id==="today"&&n?'<span class="bdg">'+n+"</span>":"")+"</button>"}).join("");
  if(TAB==="settings")html+='<button type="button" class="tab on" data-t="settings">تنظیمات</button>';
  document.getElementById("tabs").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){TAB=b.getAttribute("data-t");renderAll();window.scrollTo(0,0)}});
}
function renderFilters(){
  var cats=uniq(ITEMS.map(function(i){return i.cat}));
  document.getElementById("filters").innerHTML='<input id="fq" placeholder="جستجو..." value="'+(FILTERS.q||"")+'" style="min-width:120px">'+
    '<label>دسته<select id="fcat"><option value="">همه</option>'+cats.map(function(c){return"<option"+(FILTERS.cat===c?" selected":"")+">"+esc(c)+"</option>"}).join("")+"</select></label>"+
    '<label>'+tip("اهمیت کالا","critLevel")+'<select id="fcrit"><option value="">همه</option><option value="A">A حیاتی</option><option value="B">B مهم</option><option value="C">C عادی</option></select></label>'+
    '<label>'+tip("وضعیت موجودی","warningStatus")+'<select id="fstock"><option value="">همه</option><option value="CRITICAL">بحرانی (کمبود امروز)</option><option value="WARNING">هشدار (نزدیک نقطه سفارش)</option><option value="GOOD">سالم</option></select></label>'+
    '<label>سلامت<select id="fhealth"><option value="">همه</option><option value="HEALTHY">سالم</option><option value="SLOW">کم‌گردش</option><option value="DEAD">راکد</option></select></label>'+
    '<button type="button" class="btn-sm" id="fclear">پاک فیلتر</button>';
  if(FILTERS.crit)document.getElementById("fcrit").value=FILTERS.crit;
  if(FILTERS.stock)document.getElementById("fstock").value=FILTERS.stock;
  if(FILTERS.health)document.getElementById("fhealth").value=FILTERS.health;
  function bind(){FILTERS.q=document.getElementById("fq").value.trim();FILTERS.cat=document.getElementById("fcat").value;FILTERS.crit=document.getElementById("fcrit").value;FILTERS.stock=document.getElementById("fstock").value;FILTERS.health=document.getElementById("fhealth").value;renderAll()}
  ["fq","fcat","fcrit","fstock","fhealth"].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=e.oninput=bind});
  document.getElementById("fclear").onclick=function(){FILTERS={};renderFilters();renderAll()};
}

      ord.length?ord.map(actHtml).join(""):'<div class="empty">موردی نیست</div>',

function viewPlan30(list){
  var acts=buildList(list,inMonthActions);
  acts.sort(function(a,b){return(a.dts||999)-(b.dts||999)||(a.stock||0)-(b.stock||0)});
  STORE.plan30=acts;
  var b={d7:0,d30:0,d90:0,more:0};
  list.forEach(function(i){var d=i.dts;if(d>0&&d<=7)b.d7++;else if(d<=30)b.d30++;else if(d<=90)b.d90++;else b.more++});
  var maxb=Math.max(b.d7,b.d30,b.d90,b.more,1);
  var sorted=list.slice().sort(function(a,b){return(a.dts||999)-(b.dts||999)||(a.stock||0)-(b.stock||0)});
  STORE.allForecast=sorted.map(function(i){var m=actionMeta(i);return Object.assign({},i,{_problem:m.problem,_action:m.action})});
  var rows=sorted.map(function(i){
    return"<tr onclick=\"openItem('"+i.code+"')\"><td class=\"r\"><b>"+esc(i.name)+'</b><div style="font-size:10px;color:var(--mu)">'+esc(i.code)+"</div></td>"+
      '<td class="num" style="font-weight:700;color:'+(i.dts<=7?"var(--crit)":i.dts<=30?"var(--high)":"")+'">'+fmt(i.dts,1)+"</td>"+
      '<td class="num">'+fmt(i.coverage,1)+'</td><td class="num">'+fmt(i.avgLead,1)+'</td><td class="num">'+fmt(Math.round(i.qty))+"</td>"+
      '<td><span class="chip '+sev(i.timing)+'">'+(i.timing||"—")+"</span></td></tr>";
  }).join("");
  return'<div class="sync-line">آخرین بروزرسانی: '+toJalali(GEN)+'</div>'+
    collapsible("p30","اقدامات مورد نیاز طی یک ماه پیش‌رو",acts.length,
      acts.length?acts.map(actHtml).join(""):'<div class="empty">موردی نیست</div>',"STORE.plan30","اقدامات ۳۰ روز")+
    collapsible("horizon","افق اتمام موجودی",null,
      [["تا ۷ روز",b.d7,"r"],["۸ تا ۳۰ روز",b.d30,"o"],["۳۱ تا ۹۰ روز",b.d90,"b"],["بیش از ۹۰ روز",b.more,"g"]].map(function(x){
        return'<div class="bar-r"><div class="bar-n">'+x[0]+'</div><div class="bar-t"><div class="bar-f '+x[2]+'" style="width:'+(x[1]/maxb*100)+'%"></div></div><b>'+x[1]+"</b></div>";
      }).join(""),null,null)+
    collapsible("forecast","جدول پیش‌بینی همه کالاها",sorted.length,
      '<div class="tbl-w"><table><thead><tr><th class="r">کالا</th><th>'+tip("روز تا اتمام","dts")+'</th><th>'+tip("پوشش","coverage")+'</th><th>'+tip("زمان تأمین","lead")+'</th><th>سفارش</th><th>زمان‌بندی</th></tr></thead><tbody>'+rows+"</tbody></table></div>",
      "STORE.allForecast","جدول پیش‌بینی کالاها");
}

function viewHealth(list){
  var healthy=list.filter(function(i){return i.health==="HEALTHY"}).length;
  var pct=list.length?Math.round(healthy/list.length*100):0;
  var st={};list.forEach(function(i){st[i.stockStatus]=(st[i.stockStatus]||0)+1});
  var maxs=Math.max(st.CRITICAL||0,st.WARNING||0,st.GOOD||0,1);
  return'<div class="hint">'+tip("معنی وضعیت هشدار","warningStatus")+"</div>"+
    '<div class="two"><div class="panel"><div class="st"><span><span class="dot"></span> سهم کالاهای سالم</span></div>'+
    '<div class="gauge" style="background:conic-gradient('+(pct>=70?"var(--good)":pct>=40?"var(--med)":"var(--crit)")+" "+(pct*3.6)+'deg,var(--track) 0)"><span>'+pct+"٪</span></div>"+
    '<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--mu)">'+healthy+" از "+list.length+"</div></div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> توزیع وضعیت موجودی</span></div>'+
    ["CRITICAL","WARNING","GOOD"].map(function(k){return'<div class="bar-r"><div class="bar-n">'+(k==="WARNING"?tip("هشدار","warningStatus"):labStatus(k))+'</div><div class="bar-t"><div class="bar-f '+(k==="CRITICAL"?"r":k==="WARNING"?"o":"g")+'" style="width:'+((st[k]||0)/maxs*100)+'%"></div></div><b>'+(st[k]||0)+"</b></div>"}).join("")+"</div></div>";
}

function viewItems(list){

function viewOverviewMgmt(list){
  var totalVal=list.reduce(function(s,i){return s+invValue(i)},0);
  var deadList=list.filter(function(i){return i.dead||i.slow||i.health==="DEAD"||i.health==="SLOW"});
  deadList.forEach(function(i){i._problem=labHealth(i.health);i._action=rial(invValue(i))});
  STORE.dead=deadList;
  var deadVal=deadList.reduce(function(s,i){return s+invValue(i)},0);
  var deadPct=totalVal?deadVal/totalVal*100:0;
  var scores=[],turns=[];
  list.forEach(function(i){var h=healthScore(i);if(h!=null)scores.push(h);var t=turnover(i);if(t>0)turns.push(t)});
  var avgH=scores.length?scores.reduce(function(a,b){return a+b},0)/scores.length:null;
  var avgTurn=turns.length?turns.reduce(function(a,b){return a+b},0)/turns.length:null;
  var buy=list.filter(function(i){return i.qty>0});
  buy.forEach(function(i){var m=actionMeta(i);i._problem=m.problem;i._action=m.action+" · "+rial(i.qty*unitCost(i))});
  STORE.buy=buy;
  var costAll=orderCost(buy);
  var today=buildList(list,isOrderToday);STORE.today=today;
  var costToday=orderCost(today);
  var riskItems=list.filter(isHighRiskSup);
  riskItems.forEach(function(i){i._problem="تأمین پرریسک: "+(i.prefRisk||"");i._action="جستجوی تأمین‌کننده مناسب‌تر · "+(i.prefSup||"")});
  STORE.riskSup=riskItems;
  var riskPct=list.length?riskItems.length/list.length*100:0;
  var crit=list.filter(isCritical);crit.forEach(function(i){var m=actionMeta(i);i._problem=m.problem;i._action=m.action});STORE.critM=crit;
  var deadOnly=list.filter(function(i){return i.dead||i.health==="DEAD"});deadOnly.forEach(function(i){i._problem="راکد";i._action="تعیین تکلیف"});STORE.deadOnly=deadOnly;
  var slowOnly=list.filter(function(i){return i.slow||i.health==="SLOW"});slowOnly.forEach(function(i){i._problem="کم‌گردش";i._action="بازبینی حداقل موجودی"});STORE.slowOnly=slowOnly;
  var shortageRisk=list.filter(function(i){return isCritical(i)||i.stockStatus==="WARNING"});
  shortageRisk.forEach(function(i){var m=actionMeta(i);i._problem=labStatus(i.stockStatus);i._action=m.action});STORE.shortage=shortageRisk;

  var planBlocks=
    collapsible("hp-crit","رفع کمبود بحرانی",crit.length,crit.length?crit.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.critM","رفع کمبود بحرانی")+
    collapsible("hp-buy","اجرای خریدهای پیشنهادی — "+rial(costAll),buy.length,buy.length?buy.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.buy","خریدهای پیشنهادی")+
    collapsible("hp-dead","تعیین تکلیف کالای راکد",deadOnly.length,deadOnly.length?deadOnly.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.deadOnly","کالای راکد")+
    collapsible("hp-slow","کاهش کم‌گردش",slowOnly.length,slowOnly.length?slowOnly.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.slowOnly","کم‌گردش")+
    collapsible("hp-risk","بهبود تأمین پرریسک",riskItems.length,riskItems.length?riskItems.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.riskSup","تأمین پرریسک");

  STORE.planAll=[].concat(crit,buy,deadOnly,slowOnly,riskItems);

  return'<div class="sync-line">آخرین بروزرسانی: '+toJalali(GEN)+'</div>'+
    (!VALUES.length?'<div class="msg">جدول values ناقص است.</div>':'')+
    '<div class="kpi-g">'+
      '<div class="kpi i"><div class="l">'+tip("ارزش کل موجودی","totalVal")+'</div><div class="v" style="font-size:15px">'+rial(totalVal)+'</div></div>'+
      '<div class="kpi h" onclick="openShare(\'هزینه سفارش‌های پیشنهادی\',STORE.buy)"><div class="l">'+tip("هزینه سفارش‌های پیشنهادی","costAll")+'</div><div class="v" style="font-size:15px">'+rial(costAll)+'</div><div class="go">لیست / چاپ ←</div></div>'+
      '<div class="kpi c" onclick="openShare(\'هزینه سفارش امروز\',STORE.today)"><div class="l">'+tip("هزینه سفارش امروز","costToday")+'</div><div class="v" style="font-size:15px">'+rial(costToday)+'</div><div class="go">لیست / چاپ ←</div></div>'+
      '<div class="kpi g"><div class="l">'+tip("٪ سلامت پرتفوی","healthPct")+'</div><div class="v">'+(avgH!=null?fmt(avgH,0)+"%":"—")+'</div></div>'+
      '<div class="kpi i"><div class="l">'+tip("نرخ گردش سرمایه","turnover")+'</div><div class="v">'+(avgTurn!=null?fmt(avgTurn,2):"—")+'</div></div>'+
      '<div class="kpi m" onclick="openShare(\'خواب سرمایه\',STORE.dead)"><div class="l">'+tip("خواب سرمایه","deadVal")+'</div><div class="v" style="font-size:15px">'+rial(deadVal)+'</div><div class="s">'+fmt(deadPct,1)+'٪ از کل</div><div class="go">لیست / چاپ / اشتراک ←</div></div>'+
      '<div class="kpi c" onclick="openShare(\'کالا با تأمین پرریسک\',STORE.riskSup)"><div class="l">'+tip("% کالاهای تأمین پرریسک","riskSupPct")+'</div><div class="v">'+fmt(riskPct,0)+'٪</div><div class="s">'+riskItems.length+' کالا</div><div class="go">لیست / چاپ / اشتراک ←</div></div>'+
    "</div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> '+tip("مسیر رسیدن به سلامت بهتر","healthPlan")+'</span>'+
      '<button type="button" class="btn-sm primary" onclick="openShare(\'کل مسیر سلامت\',STORE.planAll)">چاپ / اشتراک همه</button></div>'+planBlocks+"</div>"+
    viewHealth(list)+
    collapsible("shortage","موارد ریسک کمبود",shortageRisk.length,
      shortageRisk.length?shortageRisk.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.shortage","ریسک کمبود");
}

function viewFinance(list){
  var over=list.filter(isOverOneYear);
  over.forEach(function(i){i._problem="موجودی > یک سال";i._action=rial(invValue(i))+" · پوشش "+fmt(i.coverage,0)+" روز"});
  STORE.over=over;
  var lowT=list.filter(function(i){return turnover(i)>0&&turnover(i)<1}).sort(function(a,b){return turnover(a)-turnover(b)});
  var byCat={};list.forEach(function(i){byCat[i.cat||"سایر"]=(byCat[i.cat||"سایر"]||0)+invValue(i)});
  var maxc=1;for(var k in byCat)if(byCat[k]>maxc)maxc=byCat[k];
  function costBlock(items,key,title){
    STORE[key]=items.filter(function(i){return i.qty>0}).map(function(i){return Object.assign({},i,{_problem:"سفارش",_action:rial(i.qty*unitCost(i))})});
    var rows=STORE[key].map(function(i){return"<tr onclick=\"openItem('"+i.code+"')\"><td class=\"r\">"+esc(i.name)+'</td><td class="num">'+fmt(Math.round(i.qty))+'</td><td class="num">'+rial(unitCost(i))+'</td><td class="num">'+rial(i.qty*unitCost(i))+"</td></tr>"}).join("")||'<tr><td colspan="4" class="empty">—</td></tr>';
    return collapsible(key,title+" — "+rial(orderCost(items)),STORE[key].length,
      '<div class="tbl-w"><table><thead><tr><th class="r">کالا</th><th>مقدار</th><th>هزینه واحد</th><th>هزینه ردیف</th></tr></thead><tbody>'+rows+"</tbody></table></div>",
      "STORE."+key,title);
  }
  return collapsible("over","مازاد — موجودی بیش از یک سال",over.length,
      over.length?over.map(actHtml).join(""):'<div class="empty">موردی با پوشش ≥ یک سال نیست</div>',"STORE.over","مازاد بیش از یک سال")+
    costBlock(buildList(list,isOrderToday),"costT","جزئیات هزینه سفارش امروز")+
    costBlock(list,"costA","جزئیات هزینه سفارش‌های پیشنهادی")+
    collapsible("lowt","گردش سرمایه پایین",lowT.length,
      lowT.length?lowT.map(function(i){return'<div class="bar-r" onclick="openItem(\''+i.code+'\')"><div class="bar-n">'+esc(i.name)+'</div><div class="bar-t"><div class="bar-f o" style="width:45%"></div></div><b>'+fmt(turnover(i),2)+"</b></div>"}).join(""):'<div class="empty">—</div>',null,null)+
    '<div class="panel"><div class="st"><span><span class="dot"></span> ارزش موجودی بر اساس دسته</span></div>'+
    Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).map(function(k){return'<div class="bar-r"><div class="bar-n">'+esc(k)+'</div><div class="bar-t"><div class="bar-f gold" style="width:'+(byCat[k]/maxc*100)+'%"></div></div><b>'+rial(byCat[k])+"</b></div>"}).join("")+"</div>";
}

function viewSuppliers(list){
  var codes={};list.forEach(function(i){codes[i.code]=1});
  var map={};
  SUPPLIERS.forEach(function(s){
    if(s.itemCode&&!codes[s.itemCode])return;
    if(!map[s.code])map[s.code]={code:s.code,name:s.name,delayRate:0,avgDelay:0,risk:s.risk,n:0,score:0};
    map[s.code].n++;
    if(s.delayRate>=map[s.code].delayRate){map[s.code].delayRate=s.delayRate;map[s.code].avgDelay=s.avgDelay;map[s.code].risk=s.risk}
    map[s.code].score=map[s.code].delayRate*50+Math.min(map[s.code].avgDelay,20)+(/high|crit/i.test(map[s.code].risk)?30:/med/i.test(map[s.code].risk)?12:0);
  });
  var arr=[];for(var k in map)arr.push(map[k]);
  arr.sort(function(a,b){return a.score-b.score});
  var high=arr.filter(function(s){return/high|crit/i.test(s.risk)});
  var avgD=arr.length?arr.reduce(function(s,a){return s+a.avgDelay},0)/arr.length:0;
  var best=arr.slice(0,5);
  var worst=arr.filter(function(s){return/high|crit|med/i.test(s.risk)}).slice().sort(function(a,b){return b.score-a.score}).slice(0,8);
  if(!worst.length)worst=arr.slice(-5).reverse();
  STORE.worstSup=worst.map(function(s){return{code:s.code,name:s.name,stockStatus:"",dts:0,qty:0,stock:s.n,_problem:"ریسک "+s.risk+" · تأخیر "+fmt(s.delayRate*100,0)+"%",_action:"بهبود یا تعویض"}});
  function srow(s,rank){return'<div class="act"><div class="prio">'+rank+'</div><div><div class="nm">'+esc(s.name)+'</div><div class="mt">تأخیر '+fmt(s.delayRate*100,0)+'٪ · '+esc(s.risk)+' · '+s.n+' کالا</div></div><span class="chip '+sev(s.risk)+'">'+esc(s.risk)+"</span></div>"}
  return'<div class="kpi-g"><div class="kpi i"><div class="l">تأمین‌کنندگان فعال</div><div class="v">'+arr.length+'</div></div>'+
    '<div class="kpi c"><div class="l">تأمین‌کنندگان پرریسک</div><div class="v">'+high.length+'</div></div>'+
    '<div class="kpi h"><div class="l">میانگین تأخیر</div><div class="v">'+fmt(avgD,1)+'</div><div class="s">روز</div></div></div>'+
    '<div class="two"><div class="panel"><div class="st"><span><span class="dot"></span> بهترین‌ها</span></div>'+(best.map(function(s,i){return srow(s,i+1)}).join("")||'<div class="empty">—</div>')+"</div>"+
    collapsible("worst","نیازمند بهبود یا تعویض",worst.length,worst.map(function(s,i){return srow(s,i+1)}).join("")||'<div class="empty">—</div>',"STORE.worstSup","تأمین‌کنندگان نیازمند بهبود")+"</div>";
}

function viewStrategy(list){
  var d14=list.filter(function(i){return i.dts>0&&i.dts<=14}).sort(function(a,b){return a.dts-b.dts});
  d14.forEach(function(i){var m=actionMeta(i);i._problem=m.problem;i._action=m.action});
  var shortC=list.filter(function(i){return i.coverage>0&&i.avgLead>0&&i.coverage<i.avgLead});
  shortC.forEach(function(i){i._problem="پوشش "+fmt(i.coverage,0)+" < Lead "+fmt(i.avgLead,0);i._action=i.qty?("سفارش "+fmt(Math.round(i.qty))):"پایش"});
  STORE.d14=d14;STORE.shortC=shortC;
  return'<div class="kpi-g">'+
    '<div class="kpi c"><div class="l">اتمام در ۱۴ روز یا کمتر</div><div class="v">'+d14.length+'</div></div>'+
    '<div class="kpi h"><div class="l">'+tip("پوشش کمتر از زمان تأمین","shortCover")+'</div><div class="v">'+shortC.length+'</div></div></div>'+
    collapsible("d14","لیست اتمام ≤ ۱۴ روز",d14.length,d14.length?d14.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.d14","اتمام ≤۱۴ روز")+
    collapsible("sc","لیست پوشش < زمان تأمین",shortC.length,shortC.length?shortC.map(actHtml).join(""):'<div class="empty">—</div>',"STORE.shortC","پوشش کوتاه");
}

function viewSettings(){
  var th=document.documentElement.getAttribute("data-theme")||"light";
  return'<div class="panel"><div class="st"><span><span class="dot"></span> پوسته</span></div><div class="theme-g">'+
    '<button type="button" class="theme-opt'+(th==="light"?" on":"")+'" data-t="light"><div class="theme-prev" style="background:linear-gradient(135deg,#f0f3f9,#1e40af)"></div>روشن</button>'+
    '<button type="button" class="theme-opt'+(th==="dark"?" on":"")+'" data-t="dark"><div class="theme-prev" style="background:linear-gradient(135deg,#0a0e17,#60a5fa)"></div>تاریک</button>'+
    '<button type="button" class="theme-opt'+(th==="sand"?" on":"")+'" data-t="sand"><div class="theme-prev" style="background:linear-gradient(135deg,#f7f1e8,#9a3412)"></div>خاکی</button></div></div>'+
    '<div class="panel"><div class="st"><span><span class="dot"></span> منبع</span></div><div style="font-size:13px;line-height:1.9">'+(LIVE?"زنده":"نمونه")+" · "+toJalali(GEN)+"<br>کالا "+ITEMS.length+" · values "+VALUES.length+" · رمز ۱ / ۲</div></div>";
}

function updatePill(){var el=document.getElementById("syncPill"),h=hoursAgo(GEN);if(!LIVE){el.className="pill n";el.textContent="داده نمونه";return}if(h!=null&&h>2){el.className="pill o";el.textContent="داده قدیمی";return}el.className="pill g";el.textContent="زنده"}
function renderAll(){
  renderTabs();updatePill();
  var list=filtered();
  var map={today:viewToday,plan30:viewPlan30,health:viewHealth,items:viewItems,overview:viewOverviewMgmt,finance:viewFinance,suppliers:viewSuppliers,strategy:viewStrategy,settings:viewSettings};
  document.getElementById("view").innerHTML=(map[TAB]||viewToday)(list);
  if(TAB==="settings")Array.prototype.forEach.call(document.querySelectorAll(".theme-opt"),function(b){b.onclick=function(){saveTheme(b.getAttribute("data-t"));renderAll()}});
  bindTips();
}
function bindTips(){
  Array.prototype.forEach.call(document.querySelectorAll(".has-tip"),function(el){
    el.onmouseenter=el.onclick=function(e){
      var box=document.getElementById("tipBox");box.textContent=el.getAttribute("data-tip")||"";box.classList.add("on");
      var r=el.getBoundingClientRect();box.style.left=Math.min(window.innerWidth-20,Math.max(10,r.left))+"px";box.style.top=(r.bottom+8)+"px";e.stopPropagation();
    };
  });
}
document.addEventListener("click",function(){document.getElementById("tipBox").classList.remove("on")});

function loadData(){
  LIVE=false;var i=0;
  function next(){
    if(i>=DATA_URLS.length){normalize(SAMPLE);document.getElementById("sampleBanner").classList.add("on");renderFilters();renderAll();return}
    fetch(DATA_URLS[i++]+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("x");return r.json()}).then(function(raw){
      normalize(raw);LIVE=true;document.getElementById("sampleBanner").classList.remove("on");renderFilters();renderAll();
    }).catch(function(){next()});
  }
  next();
}

document.getElementById("lockModes").onclick=function(e){var b=e.target.closest(".lock-mode");if(!b)return;chosenLock=b.getAttribute("data-m");document.getElementById("lockModes").style.display="none";document.getElementById("lockPass").classList.add("on");document.getElementById("lockPin").focus()};
document.getElementById("lockBack").onclick=function(){chosenLock=null;document.getElementById("lockModes").style.display="grid";document.getElementById("lockPass").classList.remove("on")};
function tryUnlock(){
  var pin=(document.getElementById("lockPin").value||"").trim(),need=chosenLock==="mgmt"?CODE_MGMT:CODE_OPS;
  if(pin===need){setAuthed(true);MODE=chosenLock||"ops";try{sessionStorage.setItem(LS_MODE,MODE)}catch(e){}
    document.getElementById("lock").classList.add("hid");document.getElementById("app").classList.add("on");
    Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"),function(x){x.classList.toggle("on",x.getAttribute("data-m")===MODE)});
    TAB=tabsForMode()[0].id;loadData();
  }else{document.getElementById("lockErr").textContent="رمز نادرست است";document.getElementById("lockPin").value=""}
}
document.getElementById("lockGo").onclick=tryUnlock;
document.getElementById("lockPin").onkeydown=function(e){if(e.key==="Enter")tryUnlock()};
document.getElementById("btnLogout").onclick=function(){setAuthed(false);location.reload()};
document.getElementById("btnRefresh").onclick=loadData;
document.getElementById("btnSettings").onclick=function(){TAB="settings";renderAll()};
document.getElementById("drawerX").onclick=closeDrawer;document.getElementById("drawerBg").onclick=closeDrawer;
document.getElementById("shareX").onclick=function(){document.getElementById("shareModal").classList.remove("on")};
document.getElementById("shareModal").onclick=function(e){if(e.target.id==="shareModal")document.getElementById("shareModal").classList.remove("on")};
document.getElementById("optPrint").onclick=doPrint;
document.getElementById("optPdf").onclick=function(){alert("در پنجره چاپ، مقصد را «ذخیره به‌صورت PDF» انتخاب کنید.");doPrint()};
document.getElementById("optShare").onclick=doShare;
document.getElementById("optCopy").onclick=doCopy;
document.getElementById("modeSeg").onclick=function(e){
  var b=e.target.closest("button[data-m]");if(!b)return;MODE=b.getAttribute("data-m");TAB=tabsForMode()[0].id;
  Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"),function(x){x.classList.toggle("on",x.getAttribute("data-m")===MODE)});
  FILTERS={};renderFilters();renderAll();
};
window.STORE=STORE;

if(isAuthed()){
  try{MODE=sessionStorage.getItem(LS_MODE)||"ops"}catch(e){}
  document.getElementById("lock").classList.add("hid");document.getElementById("app").classList.add("on");
  Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"),function(x){x.classList.toggle("on",x.getAttribute("data-m")===MODE)});
  loadData();
}
})();
</script>
