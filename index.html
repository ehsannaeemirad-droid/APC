<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.has-tip{border-bottom:1px dashed var(--mu2);cursor:help}
#tipBox{position:fixed;z-index:9000;max-width:min(320px,88vw);background:#0f172a;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.7;opacity:0;pointer-events:none;transition:.15s;box-shadow:0 12px 32px rgba(0,0,0,.4);text-align:right}

#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#070d1c,#0f172a 50%,#1e3a8a);display:flex;align-items:center;justify-content:center;padding:20px}

.lock-box{background:#fff;border-radius:18px;padding:26px 22px;width:min(400px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}

.lock-box .sub{font-size:11.5px;color:#64748b;margin-bottom:16px}
.lock-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock-mode{border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 10px}
.lock-mode:hover{border-color:#3b82f6}
.lock-mode b{display:block;font-size:13px}.lock-mode span{font-size:10.5px;color:#64748b}
.lock-pass{display:none}.lock-pass.on{display:block}
.lock-pass input{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.25em;margin:10px 0}
.lock-pass .go{width:100%;padding:12px;border-radius:10px;background:#1e40af;color:#fff;font-weight:700}
.lock-err{color:#e11d48;font-size:12px;min-height:18px;font-weight:600}
#app{display:none}#app.on{display:block}
.sample-banner{display:none;background:#fef3c7;color:#854d0e;text-align:center;padding:6px;font-size:12px;font-weight:600}
.sample-banner.on{display:block}
.header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2) 55%,var(--hdr3));color:#fff;padding:10px 16px;position:sticky;top:0;z-index:50}
.header-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover}
.brand h1{font-size:14px;font-weight:800}
.brand p{font-size:10px;color:#94a3b8}.brand .co{color:var(--gold2);font-weight:700}
.hdr-right{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-inline-start:auto}
.pill{font-size:10px;padding:4px 9px;border-radius:999px;font-weight:700}
.pill.g{background:rgba(16,185,129,.2);color:#34d399}.pill.n{background:rgba(148,163,184,.2);color:#cbd5e1}.pill.o{background:rgba(245,158,11,.2);color:#fbbf24}

.seg button.on{background:var(--p2);color:#fff}
.btn{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs-wrap{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:58px;z-index:40}
.tabs{max-width:1500px;margin:0 auto;display:flex;overflow-x:auto;padding:0 12px;gap:2px}
.tab{padding:11px 12px;font-size:12.5px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--p2);border-bottom-color:var(--p2);font-weight:700}
.tab .bdg{background:var(--crit);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-right:4px}
.main{max-width:1500px;margin:0 auto;padding:14px 14px 60px}

.kpi-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--shadow)}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px}
.kpi.c::before{background:var(--crit)}.kpi.h::before{background:var(--high)}.kpi.m::before{background:var(--med)}.kpi.g::before{background:var(--good)}.kpi.i::before{background:var(--info)}.kpi.gold::before{background:var(--gold2)}
.kpi .l{font-size:11.5px;color:var(--mu);font-weight:600}.kpi .v{font-size:18px;font-weight:800;margin-top:4px}.kpi .s{font-size:10.5px;color:var(--mu2);margin-top:3px}.kpi .go{font-size:10.5px;color:var(--p2);margin-top:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.st{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.st small{font-weight:500;color:var(--mu);font-size:11.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}

.act{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:7px;cursor:pointer}
.act:hover{background:var(--th)}.act.c{border-inline-start:3px solid var(--crit)}.act.h{border-inline-start:3px solid var(--high)}
.prio{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
.act .nm{font-weight:700;font-size:13px}.act .mt{font-size:11.5px;color:var(--mu);margin-top:2px}
.days{font-weight:800;direction:ltr;text-align:center;font-size:13px;min-width:52px}.days.bad{color:var(--crit)}.days.warn{color:var(--high)}
.tbl-w{overflow:auto;max-height:480px;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--th);padding:9px 10px;text-align:center;font-size:11px;color:var(--t2);border-bottom:1px solid var(--bd);z-index:1}
th.r{text-align:right}td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:center;vertical-align:middle}td.r{text-align:right}
tr:hover td{background:var(--th);cursor:pointer}.num{direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
.bar-r{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px}
.bar-n{width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{flex:1;height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;min-width:2px}.bar-f.r{background:var(--crit)}.bar-f.o{background:var(--high)}.bar-f.g{background:var(--good)}.bar-f.b{background:var(--info)}.bar-f.gold{background:var(--gold2)}
.gauge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto}

.drawer.on{transform:translateX(0)}

};

var ITEMS=[],SUPPLIERS=[],VALUES=[],VALMAP={},LIVE=false,GEN=null,MODE="ops",TAB="today",FILTERS={},chosenLock=null;

function n(v){return(v==null||v===""||isNaN(Number(v)))?0:Number(v)}
function fmt(v,d){d=d||0;if(v==null||isNaN(v))return"—";return Number(v).toLocaleString("en-US",{maximumFractionDigits:d})}
function rial(v){if(v==null||isNaN(v))return"—";v=Number(v);if(Math.abs(v)>=1e9)return(v/1e9).toFixed(2)+" میلیارد ریال";if(Math.abs(v)>=1e6)return(v/1e6).toFixed(1)+" میلیون ریال";if(Math.abs(v)>=1e3)return(v/1e3).toFixed(0)+" هزار ریال";return fmt(Math.round(v))+" ریال"}
function toJalali(iso){if(!iso)return"—";try{var d=new Date(iso);if(isNaN(d.getTime()))return String(iso).slice(0,10);return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}catch(e){return String(iso).slice(0,10)}}
function hoursAgo(iso){if(!iso)return null;var t=new Date(iso).getTime();if(isNaN(t))return null;return(Date.now()-t)/36e5}
function uniq(a){var o={},r=[],i;for(i=0;i<a.length;i++)if(a[i]&&!o[a[i]]){o[a[i]]=1;r.push(a[i])}return r.sort()}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function tip(label,key){return'<span class="has-tip" data-tip="'+esc(TIPS[key]||label)+'">'+esc(label)+"</span>"}

function isAuthed(){try{return sessionStorage.getItem(LS_AUTH)==="1"}catch(e){return false}}
function setAuthed(v){try{if(v)sessionStorage.setItem(LS_AUTH,"1");else sessionStorage.removeItem(LS_AUTH)}catch(e){}}
function loadTheme(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem(LS_THEME)||"light")}catch(e){}}
function saveTheme(t){try{localStorage.setItem(LS_THEME,t)}catch(e){}document.documentElement.setAttribute("data-theme",t)}
loadTheme();

function mapItem(r){
  return{code:r.ItemCode||"",name:r.ItemName||"—",cat:r.CategoryCode||"",sub:r.SubCategoryCode||"",
    crit:r.Criticality||"",stock:n(r.AvailableStock!=null?r.AvailableStock:r.TotalStock),
    coverage:n(r.CoverageDays),dts:n(r.DaysToStockout),
    stockStatus:String(r.StockStatus||"GOOD").toUpperCase(),rec:String(r.OrderRecommendation||"OK").toUpperCase(),
    urgency:String(r.UrgencyLevel||"LOW").toUpperCase(),qty:n(r.SuggestedOrderQty),
    timing:String(r.OrderTimingStatus||"").toUpperCase(),gap:n(r.OrderTimingGap),
    health:String(r.InventoryHealthStatus||"HEALTHY").toUpperCase(),
    dead:!!(r.DeadStockFlag===true||r.DeadStockFlag===1||String(r.DeadStockFlag).toLowerCase()==="true"),
    slow:!!(r.SlowMovingFlag===true||r.SlowMovingFlag===1||String(r.SlowMovingFlag).toLowerCase()==="true"),
    action:!!(r.ActionFlag===true||r.ActionFlag===1),
    daily:n(r.AvgDailyDemand),monthly:n(r.AvgMonthlyDemand),monthsReceipt:n(r.MonthsSinceLastReceipt),
    safety:n(r.SafetyStock),reorder:n(r.ReorderPoint),avgLead:n(r.AvgLeadTime),
    forecast:r.ForecastStockoutDate||"",optimal:r.OptimalOrderDay||"",
    prefSup:r.PreferredSupplierCode||"",prefRisk:String(r.PreferredSupplierRiskLevel||"")};
}
function mapSup(s){return{code:s.SupplierCode||"",name:s.SupplierName||"—",itemCode:s.ItemCode||"",deliveries:n(s.TotalDeliveries),late:n(s.LateDeliveries),avgDelay:n(s.AvgDelayDays),delayRate:n(s.DelayRate),risk:String(s.SupplierRiskLevel||"Low"),preferred:!!(s.Preferred===true||s.Preferred===1)}}
function mapVal(v){return{code:v.ItemCode||"",value:n(v.InventoryValue),turnover:n(v.TurnoverRatio),healthScore:n(v.HealthScore),unitCost:n(v.LatestUnitCost),overstock:!!(v.OverstockFlag===true||v.OverstockFlag===1||String(v.OverstockFlag).toUpperCase()==="TRUE")}}
function normalize(raw){
  ITEMS=(raw.items||[]).map(mapItem).filter(function(i){return i.code});
  SUPPLIERS=(raw.suppliers||[]).map(mapSup).filter(function(s){return s.code});
  VALUES=(raw.values||[]).map(mapVal);VALMAP={};VALUES.forEach(function(v){if(v.code)VALMAP[v.code]=v});
  GEN=raw.generated||raw.lastUpdated||null;
}
function unitCost(i){var v=VALMAP[i.code];return v?v.unitCost:0}
function invValue(i){var v=VALMAP[i.code];return v?v.value:0}
function healthScore(i){var v=VALMAP[i.code];return v&&v.healthScore?v.healthScore:null}
function turnover(i){var v=VALMAP[i.code];return v?v.turnover:0}
function isOverYear(i){return i.monthsReceipt>=12||(VALMAP[i.code]&&VALMAP[i.code].overstock)||(i.coverage>=365)}

function filtered(){return ITEMS.filter(function(i){
  if(FILTERS.cat&&i.cat!==FILTERS.cat)return false;
  if(FILTERS.crit&&i.crit!==FILTERS.crit)return false;
  if(FILTERS.stock&&i.stockStatus!==FILTERS.stock)return false;
  if(FILTERS.health&&i.health!==FILTERS.health)return false;
  if(FILTERS.q){var q=FILTERS.q.toLowerCase();if((i.code+" "+i.name+" "+i.cat).toLowerCase().indexOf(q)<0)return false}
  return true;
})}

function isCritical(i){return i.stockStatus==="CRITICAL"}
function isWarning(i){return i.stockStatus==="WARNING"}
function isOrderToday(i){
  if(i.qty<=0)return false;
  if(i.timing.indexOf("ORDER NOW")>=0)return true;
  if(i.rec==="ORDER"&&i.dts>0&&i.dts<=45)return true;
  if(i.rec==="ORDER"&&isCritical(i))return true;
  if(i.gap<0&&i.qty>0&&i.dts<=45)return true;
  return false;
}
function isWarningOnly(i){return isWarning(i)&&!isOrderToday(i)}
function isUrgentToday(i){
  if(isCritical(i))return true;
  if(i.gap<0&&(i.qty>0||isCritical(i)||isWarning(i)))return true;
  if(isOrderToday(i)&&i.dts<=7)return true;
  return false;
}
function inMonthActions(i){
  if(isOrderToday(i))return true;
  if(isCritical(i)&&(i.qty>0||i.dts<=45))return true;
  if(isWarning(i)&&i.dts<=45)return true;
  if(i.rec==="ORDER"&&i.qty>0&&i.dts<=45)return true;
  if(i.gap<0&&i.qty>0&&i.dts<=45)return true;
  if(i.dts>0&&i.dts<=30&&i.qty>0)return true;
  if(i.qty<=0&&i.dts>45)return false;
  return false;
}
function actionPriority(i){
  var base=40;
  if(isCritical(i)||i.timing.indexOf("ORDER NOW")>=0||i.gap<0)base=10;
  else if(isOrderToday(i))base=15;
  else if(i.dts<=7)base=18;
  else if(i.dts<=30||isWarning(i))base=25;
  var cw=i.crit==="A"?0:i.crit==="B"?5:12;
  return base+cw+Math.min(i.dts||40,40)/20;
}
function buildActions(list,pred){
  var out=[];
  list.forEach(function(i){
    if(pred&&!pred(i))return;
    var p=actionPriority(i);
    var problem="",action="";
    if(isCritical(i)){problem="موجودی بحرانی";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))+" واحد"):"تأمین فوری"}
    else if(i.gap<0){problem="فرصت سفارش گذشته ("+fmt(Math.abs(Math.round(i.gap)))+" روز)";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"بازبینی فوری"}
    else if(i.timing.indexOf("ORDER NOW")>=0){problem="سفارش امروز";action="ثبت سفارش "+fmt(Math.round(i.qty))}
    else if(i.dts<=7){problem="اتمام ≤۷ روز";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"پایش"}
    else if(isWarning(i)||i.dts<=30){problem="افق یک‌ماهه / هشدار";action=i.qty>0?("برنامه سفارش "+fmt(Math.round(i.qty))):"پایش نقطه سفارش"}
    else{problem="نیاز به پیگیری";action=i.qty>0?("سفارش "+fmt(Math.round(i.qty))):"بررسی"}
    var o={};for(var k in i)o[k]=i[k];o._p=p;o._problem=problem;o._action=action;out.push(o);
  });
  out.sort(function(a,b){return a._p-b._p||a.dts-b.dts});
  return out;
}
function orderCost(items){return items.reduce(function(s,i){return s+i.qty*unitCost(i)},0)}
function isHighRiskSup(i){return/high|crit/i.test(i.prefRisk)}
function labStatus(s){return({CRITICAL:"بحرانی",WARNING:"هشدار",GOOD:"سالم"})[s]||s||"—"}
function labHealth(h){return({HEALTHY:"سالم",SLOW:"کم‌گردش",DEAD:"راکد"})[h]||h||"—"}
function labCrit(c){return({A:"A حیاتی",B:"B مهم",C:"C عادی"})[c]||(c||"—")}
function sev(s){s=String(s||"").toUpperCase();if(/CRIT|HIGH|DEAD/.test(s))return"c";if(/WARN|MED|SLOW/.test(s))return"h";if(/GOOD|HEALTHY|LOW/.test(s))return"g";return"i"}

function openItem(code){
  var i=null;for(var x=0;x<ITEMS.length;x++)if(ITEMS[x].code===code){i=ITEMS[x];break}if(!i)return;
  var v=VALMAP[code];
  document.getElementById("dTitle").textContent=i.name;
  document.getElementById("dSub").textContent=i.code+" · "+(i.cat||"");
  function f(l,val,tk){return'<div class="f"><div class="lb">'+(tk?tip(l,tk):esc(l))+'</div><div class="vl">'+val+"</div></div>"}
  document.getElementById("dBody").innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+
    '<span class="chip '+sev(i.stockStatus)+'">'+labStatus(i.stockStatus)+'</span><span class="chip i">'+tip(labCrit(i.crit),"critLevel")+"</span></div><div class=\"df\">"+
    f("موجودی",fmt(Math.round(i.stock)))+f("پوشش",fmt(i.coverage,1),"coverage")+f("روز تا اتمام",fmt(i.dts,1),"dts")+
    f("زمان تأمین",fmt(i.avgLead,1),"lead")+f("شکاف زمانی",fmt(i.gap,1),"timingGap")+f("سفارش پیشنهادی",fmt(Math.round(i.qty)))+
    f("تأمین‌کننده",i.prefSup||"—")+f("ریسک تأمین",i.prefRisk||"—")+f("روز بهینه",toJalali(i.optimal))+
    (v?f("هزینه واحد",rial(v.unitCost),"unitCost"):"")+(v?f("ارزش",rial(v.value)):"")+(v?f("گردش",fmt(v.turnover,2),"turnover"):"")+
    (v&&v.healthScore?f("سلامت",fmt(v.healthScore,0),"healthPct"):"")+"</div>";
  document.getElementById("drawer").classList.add("on");document.getElementById("drawerBg").classList.add("on");
}
function closeDrawer(){document.getElementById("drawer").classList.remove("on");document.getElementById("drawerBg").classList.remove("on")}
window.openItem=openItem;

function showKpiList(title,sub,rows){
  document.getElementById("kpiTitle").textContent=title;
  document.getElementById("kpiSub").textContent=sub||"";
  document.getElementById("kpiBody").innerHTML=rows.length?rows.map(function(i){
    return'<div class="act" onclick="openItem(\''+i.code+'\')">'+
      '<div class="prio">'+(i.crit||"·")+'</div><div><div class="nm">'+esc(i.name)+'</div><div class="mt">'+esc(i.code)+
      " · "+labStatus(i.stockStatus)+(i.qty?" · سفارش "+fmt(Math.round(i.qty)):"")+(invValue(i)?" · "+rial(invValue(i)):"")+"</div></div>"+
      '<div class="days '+(i.dts<=7?"bad":i.dts<=30?"warn":"")+'">'+(i.dts?Math.round(i.dts)+"ر":"—")+"</div></div>";
  }).join(""):'<div class="empty">موردی نیست</div>';
  document.getElementById("kpiModal").classList.add("on");
}
function closeKpi(){document.getElementById("kpiModal").classList.remove("on")}
window.closeKpi=closeKpi;window.showKpiList=showKpiList;

function actHtml(a){
  var sc=a._p<18?"c":a._p<30?"h":"";
  var col=a._p<18?"var(--crit)":a._p<30?"var(--high)":"var(--info)";
  return'<div class="act '+sc+'" onclick="openItem(\''+a.code+'\')"><div class="prio" style="background:'+col+'22;color:'+col+'">'+(a.crit||"·")+"</div>"+
    "<div><div class=\"nm\">"+esc(a.name)+' <span style="color:var(--mu);font-size:11px">('+esc(a.code)+")</span></div>"+
    '<div class="mt">'+esc(a._problem)+" → <b>"+esc(a._action)+"</b></div></div>"+
    '<div class="days '+(a.dts<=7?"bad":a.dts<=30?"warn":"")+'">'+(a.dts?Math.round(a.dts)+" روز":"—")+"</div></div>";
}

function tabsForMode(){
  if(MODE==="ops")return[{id:"today",label:"امروز"},{id:"plan30",label:"اقدامات ۳۰ روز"},{id:"health",label:"سلامت"},{id:"items",label:"کالاها"}];
  return[{id:"overview",label:"خلاصه مدیریتی"},{id:"finance",label:"مالی و سفارش"},{id:"suppliers",label:"تأمین‌کنندگان"},{id:"strategy",label:"ریسک"}];
}

function renderTabs(){
  var tabs=tabsForMode();
  if(TAB!=="settings"&&!tabs.some(function(t){return t.id===TAB}))TAB=tabs[0].id;
  var urgent=buildActions(filtered(),isUrgentToday).length;
  var html=tabs.map(function(t){return'<button type="button" class="tab'+(TAB===t.id?" on":"")+'" data-t="'+t.id+'">'+t.label+(t.id==="today"&&urgent?'<span class="bdg">'+urgent+"</span>":"")+"</button>"}).join("");
  if(TAB==="settings")html+='<button type="button" class="tab on" data-t="settings">تنظیمات</button>';
  document.getElementById("tabs").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){TAB=b.getAttribute("data-t");renderAll();window.scrollTo(0,0)}});
}

function renderFilters(){
  var cats=uniq(ITEMS.map(function(i){return i.cat}));
  document.getElementById("filters").innerHTML='<input id="fq" placeholder="جستجو..." value="'+(FILTERS.q||"")+'" style="min-width:120px">'+
    '<label>دسته<select id="fcat"><option value="">همه</option>'+cats.map(function(c){return"<option"+(FILTERS.cat===c?" selected":"")+">"+esc(c)+"</option>"}).join("")+"</select></label>"+
    '<label>'+tip("اهمیت کالا","critLevel")+'<select id="fcrit"><option value="">همه</option><option value="A">A حیاتی</option><option value="B">B مهم</option><option value="C">C عادی</option></select></label>'+
    '<label>وضعیت موجودی<select id="fstock"><option value="">همه</option><option value="CRITICAL">بحرانی</option><option value="WARNING">هشدار</option><option value="GOOD">سالم</option></select></label>'+
    '<label>سلامت<select id="fhealth"><option value="">همه</option><option value="HEALTHY">سالم</option><option value="SLOW">کم‌گردش</option><option value="DEAD">راکد</option></select></label>'+
    '<button type="button" class="btn" style="background:var(--th);color:var(--tx);border:1px solid var(--bd)" id="fclear">پاک فیلتر</button>';
  if(FILTERS.crit)document.getElementById("fcrit").value=FILTERS.crit;
  if(FILTERS.stock)document.getElementById("fstock").value=FILTERS.stock;
  if(FILTERS.health)document.getElementById("fhealth").value=FILTERS.health;
  function bind(){FILTERS.q=document.getElementById("fq").value.trim();FILTERS.cat=document.getElementById("fcat").value;FILTERS.crit=document.getElementById("fcrit").value;FILTERS.stock=document.getElementById("fstock").value;FILTERS.health=document.getElementById("fhealth").value;renderAll()}
  ["fq","fcat","fcrit","fstock","fhealth"].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=e.oninput=bind});
  document.getElementById("fclear").onclick=function(){FILTERS={};renderFilters();renderAll()};
}

/* ===== OPS ===== */
function viewToday(list){
  var crit=list.filter(isCritical),ord=list.filter(isOrderToday),warn=list.filter(isWarningOnly);
  var urgent=buildActions(list,isUrgentToday);
  var cls=crit.length>=2||urgent.length>=3?"bad":(crit.length||urgent.length)?"warn":"ok";
  return'<div class="hint">نمای عملیاتی — موجودی خطرناک و سفارش‌هایی که فرصت‌شان گذشته یا فوری‌اند</div>'+
    '<div class="banner '+cls+'">'+(cls==="ok"?"وضعیت پایدار":crit.length+" بحرانی · "+ord.length+" سفارش امروز · "+urgent.length+" اقدام فوری")+
    "<small>آخرین بروزرسانی: "+toJalali(GEN)+"</small></div>"+
    '<div class="kpi-g">'+
      '<div class="kpi c" onclick="showKpiList(\'موجودی بحرانی\',TIPS.critical,filtered().filter(isCritical))"><div class="l">'+tip("موجودی بحرانی","critical")+'</div><div class="v">'+crit.length+'</div><div class="go">مشاهده ←</div></div>'+
      '<div class="kpi h" onclick="showKpiList(\'سفارش امروز\',TIPS.orderToday,filtered().filter(isOrderToday))"><div class="l">'+tip("سفارش امروز","orderToday")+'</div><div class="v">'+ord.length+'</div><div class="go">مشاهده ←</div></div>'+
      '<div class="kpi m" onclick="showKpiList(\'هشدار موجودی\',TIPS.warning,filtered().filter(isWarningOnly))"><div class="l">'+tip("هشدار موجودی","warning")+'</div><div class="v">'+warn.length+'</div><div class="go">مشاهده ←</div></div>'+
    "</div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> اقدامات فوری امروز</span><small>کمبود یا فرصت سفارش گذشته</small></div>'+
    (urgent.length?urgent.map(actHtml).join(""):'<div class="empty">مورد فوری نیست</div>')+"</div>";
}

function viewPlan30(list){
  var acts=buildActions(list,inMonthActions);
  var b={d7:0,d30:0,d90:0,more:0};
  list.forEach(function(i){var d=i.dts;if(d>0&&d<=7)b.d7++;else if(d<=30)b.d30++;else if(d<=90)b.d90++;else b.more++});
  var maxb=Math.max(b.d7,b.d30,b.d90,b.more,1);
  var sorted=list.slice().sort(function(a,b){return(a.dts||999)-(b.dts||999)});
  var rows=sorted.map(function(i){
    return"<tr onclick=\"openItem('"+i.code+"')\"><td class=\"r\"><b>"+esc(i.name)+'</b><div style="font-size:10px;color:var(--mu)">'+esc(i.code)+"</div></td>"+
      '<td class="num" style="font-weight:700;color:'+(i.dts<=7?"var(--crit)":i.dts<=30?"var(--high)":"")+'">'+fmt(i.dts,1)+"</td>"+
      '<td class="num">'+fmt(i.coverage,1)+'</td><td class="num">'+fmt(i.avgLead,1)+'</td><td class="num">'+fmt(Math.round(i.qty))+"</td>"+
      '<td><span class="chip '+sev(i.timing)+'">'+(i.timing||"—")+"</span></td></tr>";
  }).join("");
  return'<div class="hint">اقدامات مورد نیاز طی یک ماه پیش‌رو + افق اتمام و جدول پیش‌بینی همه کالاها</div>'+
    '<div class="panel"><div class="st"><span><span class="dot"></span> لیست اقدامات ۳۰ روز</span><small>'+acts.length+' مورد</small></div>'+
    (acts.length?acts.map(actHtml).join(""):'<div class="empty">موردی در افق ۳۰ روز نیست</div>')+"</div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> افق اتمام موجودی</span></div>'+

function viewItems(list){

/* ===== MGMT ===== */
function healthPlanHtml(list){
  var plans=[];
  var dead=list.filter(function(i){return i.dead||i.health==="DEAD"});
  var slow=list.filter(function(i){return i.slow||i.health==="SLOW"});
  var buy=list.filter(function(i){return i.qty>0});
  var risk=list.filter(isHighRiskSup);
  var crit=list.filter(isCritical);
  if(crit.length)plans.push({t:"رفع کمبود بحرانی",d:crit.length+" کالا در وضعیت CRITICAL — اولویت تأمین و ثبت سفارش."});
  if(buy.length)plans.push({t:"اجرای خریدهای پیشنهادی",d:"هزینه تقریبی "+rial(orderCost(buy))+" برای "+buy.length+" قلم با سفارش پیشنهادی."});
  if(dead.length)plans.push({t:"تعیین تکلیف کالای راکد",d:dead.length+" قلم راکد — اسقاط، انتقال، یا مصرف برنامه‌ریزی‌شده."});
  if(slow.length)plans.push({t:"کاهش کم‌گردش",d:slow.length+" قلم کم‌گردش — بازبینی حداقل موجودی و تقاضا."});
  if(risk.length)plans.push({t:"بهبود تأمین پرریسک",d:risk.length+" کالا با تأمین‌کننده پرریسک — یافتن جایگزین مناسب‌تر."});
  if(!plans.length)plans.push({t:"حفظ وضعیت",d:"اقدام اضطراری خاصی از داده فعلی استخراج نشد."});
  return'<div class="panel"><div class="st"><span><span class="dot"></span> '+tip("مسیر رسیدن به سلامت بهتر","healthPlan")+'</span></div>'+
    plans.map(function(p){return'<div class="plan"><b>'+p.t+"</b><div style=\"font-size:12.5px;color:var(--mu);margin-top:4px\">"+p.d+"</div></div>"}).join("")+"</div>";
}

function viewOverviewMgmt(list){
  var totalVal=list.reduce(function(s,i){return s+invValue(i)},0);
  var deadList=list.filter(function(i){return i.dead||i.slow||i.health==="DEAD"||i.health==="SLOW"});
  var deadVal=deadList.reduce(function(s,i){return s+invValue(i)},0);
  var deadPct=totalVal?deadVal/totalVal*100:0;
  var scores=[],turns=[];
  list.forEach(function(i){var h=healthScore(i);if(h!=null)scores.push(h);var t=turnover(i);if(t>0)turns.push(t)});
  var avgH=scores.length?scores.reduce(function(a,b){return a+b},0)/scores.length:null;
  var avgTurn=turns.length?turns.reduce(function(a,b){return a+b},0)/turns.length:null;
  var costAll=orderCost(list.filter(function(i){return i.qty>0}));
  var costToday=orderCost(list.filter(isOrderToday));
  var riskItems=list.filter(isHighRiskSup);
  var riskPct=list.length?riskItems.length/list.length*100:0;
  var shortageRisk=list.filter(function(i){return isCritical(i)||isWarning(i)});
  return'<div class="hint">خلاصه مدیریتی — سرمایه، هزینه تأمین پیشنهادی، سلامت و ریسک تأمین</div>'+
    (!VALUES.length?'<div class="msg">جدول values ناقص است؛ اعداد مالی ممکن است صفر باشند.</div>':'')+
    '<div class="kpi-g">'+
      '<div class="kpi i"><div class="l">'+tip("ارزش کل موجودی","totalVal")+'</div><div class="v" style="font-size:15px">'+rial(totalVal)+'</div></div>'+
      '<div class="kpi h" onclick="showKpiList(\'سفارش‌های پیشنهادی\',TIPS.costAll,filtered().filter(function(i){return i.qty>0}))"><div class="l">'+tip("هزینه سفارش‌های پیشنهادی","costAll")+'</div><div class="v" style="font-size:15px">'+rial(costAll)+'</div><div class="s">تا سطح پیشنهاد سامانه</div><div class="go">جزئیات ←</div></div>'+
      '<div class="kpi c" onclick="showKpiList(\'سفارش امروز\',TIPS.costToday,filtered().filter(isOrderToday))"><div class="l">'+tip("هزینه سفارش امروز","costToday")+'</div><div class="v" style="font-size:15px">'+rial(costToday)+'</div><div class="go">جزئیات ←</div></div>'+
      '<div class="kpi g"><div class="l">'+tip("٪ سلامت پرتفوی","healthPct")+'</div><div class="v">'+(avgH!=null?fmt(avgH,0)+"%":"—")+'</div></div>'+
      '<div class="kpi i"><div class="l">'+tip("نرخ گردش سرمایه","turnover")+'</div><div class="v">'+(avgTurn!=null?fmt(avgTurn,2):"—")+'</div></div>'+
      '<div class="kpi m" onclick="showKpiList(\'خواب سرمایه — راکد و کم‌گردش\',TIPS.deadVal,deadList)"><div class="l">'+tip("خواب سرمایه","deadVal")+'</div><div class="v" style="font-size:15px">'+rial(deadVal)+'</div><div class="s">'+fmt(deadPct,1)+'٪ از کل · قابل چاپ</div><div class="go">لیست و چاپ ←</div></div>'+
      '<div class="kpi c" onclick="showKpiList(\'کالا با تأمین پرریسک — جایگزین بیابید\',TIPS.riskSupPct,riskItems)"><div class="l">'+tip("% کالاهای تأمین پرریسک","riskSupPct")+'</div><div class="v">'+fmt(riskPct,0)+'٪</div><div class="s">'+riskItems.length+' کالا · پیشنهاد تعویض تأمین</div><div class="go">لیست ←</div></div>'+
    "</div>"+
    healthPlanHtml(list)+
    (function(){
      var healthy=list.filter(function(i){return i.health==="HEALTHY"}).length;
      var pct=list.length?Math.round(healthy/list.length*100):0;
      var st={};list.forEach(function(i){st[i.stockStatus]=(st[i.stockStatus]||0)+1});
      var maxs=Math.max(st.CRITICAL||0,st.WARNING||0,st.GOOD||0,1);
      var bars=["CRITICAL","WARNING","GOOD"].map(function(k){return'<div class="bar-r"><div class="bar-n">'+labStatus(k)+'</div><div class="bar-t"><div class="bar-f '+(k==="CRITICAL"?"r":k==="WARNING"?"o":"g")+'" style="width:'+((st[k]||0)/maxs*100)+'%"></div></div><b>'+(st[k]||0)+"</b></div>"}).join("");
      return'<div class="two"><div class="panel"><div class="st"><span><span class="dot"></span> سهم کالاهای سالم</span></div>'+
        '<div class="gauge" style="background:conic-gradient('+(pct>=70?"var(--good)":pct>=40?"var(--med)":"var(--crit)")+" "+(pct*3.6)+'deg,var(--track) 0)"><span>'+pct+"٪</span></div>"+
        '<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--mu)">'+healthy+" از "+list.length+"</div></div>"+
        '<div class="panel"><div class="st"><span><span class="dot"></span> توزیع وضعیت موجودی</span></div>'+bars+"</div></div>";
    })()+
    '<div class="panel"><div class="st"><span><span class="dot"></span> موارد ریسک کمبود</span><small>'+shortageRisk.length+'</small></div>'+
    (shortageRisk.length?shortageRisk.slice(0,12).map(function(i){return actHtml(Object.assign({},i,{_p:isCritical(i)?10:25,_problem:labStatus(i.stockStatus),_action:i.qty?("سفارش "+fmt(Math.round(i.qty))):"پایش"}))}):'<div class="empty">موردی نیست</div>')+"</div>";
}

function viewFinance(list){
  var over=list.filter(isOverYear);
  var lowT=list.filter(function(i){return turnover(i)>0&&turnover(i)<1}).sort(function(a,b){return turnover(a)-turnover(b)});
  var byCat={};list.forEach(function(i){byCat[i.cat||"سایر"]=(byCat[i.cat||"سایر"]||0)+invValue(i)});
  var maxc=1;for(var k in byCat)if(byCat[k]>maxc)maxc=byCat[k];
  function costTable(items,title){
    var rows=items.filter(function(i){return i.qty>0}).sort(function(a,b){return b.qty*unitCost(b)-a.qty*unitCost(a)}).map(function(i){
      return"<tr onclick=\"openItem('"+i.code+"')\"><td class=\"r\">"+esc(i.name)+'</td><td class="num">'+fmt(Math.round(i.qty))+'</td><td class="num">'+rial(unitCost(i))+'</td><td class="num" style="font-weight:700">'+rial(i.qty*unitCost(i))+"</td></tr>";
    }).join("")||'<tr><td colspan="4" class="empty">—</td></tr>';
    return'<div class="panel"><div class="st"><span><span class="dot"></span> '+title+"</span><small>"+rial(orderCost(items.filter(function(i){return i.qty>0})))+'</small></div>'+
      '<div class="tbl-w"><table><thead><tr><th class="r">کالا</th><th>مقدار</th><th>'+tip("هزینه واحد","unitCost")+'</th><th>هزینه ردیف</th></tr></thead><tbody>'+rows+"</tbody></table></div></div>";
  }
  return'<div class="panel"><div class="st"><span><span class="dot"></span> '+tip("مازاد — پول قفل‌شده","overstock")+'</span><small>موجودی > حدود ۱ سال / پرچم مازاد · '+over.length+' مورد</small></div>'+
    (over.length?over.map(function(i){return actHtml(Object.assign({},i,{_p:40,_problem:"مازاد / خواب بلندمدت",_action:rial(invValue(i))}))}).join(""):'<div class="empty">موردی نیست</div>')+"</div>"+
    costTable(list.filter(isOrderToday),"جزئیات هزینه سفارش امروز (ریال)")+
    costTable(list,"جزئیات هزینه سفارش‌های پیشنهادی (ریال)")+
    '<div class="panel"><div class="st"><span><span class="dot"></span> گردش سرمایه پایین (Turnover &lt; 1)</span></div>'+
    (lowT.length?lowT.slice(0,15).map(function(i){return'<div class="bar-r" onclick="openItem(\''+i.code+'\')"><div class="bar-n">'+esc(i.name)+'</div><div class="bar-t"><div class="bar-f o" style="width:50%"></div></div><b>'+fmt(turnover(i),2)+"</b></div>"}).join(""):'<div class="empty">—</div>')+"</div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> ارزش موجودی بر اساس دسته</span></div>'+
    Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).map(function(k){return'<div class="bar-r"><div class="bar-n">'+esc(k)+'</div><div class="bar-t"><div class="bar-f gold" style="width:'+(byCat[k]/maxc*100)+'%"></div></div><b>'+rial(byCat[k])+"</b></div>"}).join("")+"</div>";
}

function viewSuppliers(list){
  var codes={};list.forEach(function(i){codes[i.code]=1});
  var map={};
  SUPPLIERS.forEach(function(s){
    if(s.itemCode&&!codes[s.itemCode])return;
    if(!map[s.code])map[s.code]={code:s.code,name:s.name,delayRate:0,avgDelay:0,risk:s.risk,n:0,score:0};
    map[s.code].n++;
    if(s.delayRate>=map[s.code].delayRate){map[s.code].delayRate=s.delayRate;map[s.code].avgDelay=s.avgDelay;map[s.code].risk=s.risk}
    map[s.code].score=map[s.code].delayRate*50+Math.min(map[s.code].avgDelay,20)+(/high|crit/i.test(map[s.code].risk)?30:/med/i.test(map[s.code].risk)?12:0);
  });
  var arr=[];for(var k in map)arr.push(map[k]);
  arr.sort(function(a,b){return a.score-b.score});
  var high=arr.filter(function(s){return/high|crit/i.test(s.risk)});
  var avgD=arr.length?arr.reduce(function(s,a){return s+a.avgDelay},0)/arr.length:0;
  var best=arr.slice(0,5),worst=arr.slice().reverse().filter(function(s){return/high|crit|med/i.test(s.risk)}).slice(0,5);
  if(!worst.length)worst=arr.slice(-5).reverse();
  function srow(s,rank){return'<div class="act"><div class="prio">'+rank+'</div><div><div class="nm">'+esc(s.name)+'</div><div class="mt">تأخیر '+fmt(s.delayRate*100,0)+'٪ · '+esc(s.risk)+' · '+s.n+' کالا</div></div><span class="chip '+sev(s.risk)+'">'+esc(s.risk)+"</span></div>"}
  return'<div class="kpi-g">'+
    '<div class="kpi i"><div class="l">تأمین‌کنندگان فعال</div><div class="v">'+arr.length+'</div></div>'+
    '<div class="kpi c"><div class="l">تأمین‌کنندگان پرریسک</div><div class="v">'+high.length+'</div></div>'+
    '<div class="kpi h"><div class="l">میانگین تأخیر</div><div class="v">'+fmt(avgD,1)+'</div><div class="s">روز</div></div></div>'+
    '<div class="two"><div class="panel"><div class="st"><span><span class="dot"></span> بهترین‌ها</span></div>'+(best.map(function(s,i){return srow(s,i+1)}).join("")||'<div class="empty">—</div>')+"</div>"+
    '<div class="panel"><div class="st"><span><span class="dot"></span> نیازمند بهبود یا تعویض</span></div>'+(worst.map(function(s,i){return srow(s,i+1)}).join("")||'<div class="empty">—</div>')+"</div></div>";
}

  var shortC=list.filter(function(i){return i.coverage>0&&i.avgLead>0&&i.coverage<i.avgLead});
  return'<div class="kpi-g">'+
    '<div class="kpi c" onclick="showKpiList(\'اتمام ≤ ۱۴ روز\',\'\',d14)"><div class="l">اتمام در ۱۴ روز یا کمتر</div><div class="v">'+d14.length+'</div><div class="go">لیست ←</div></div>'+
    '<div class="kpi h" onclick="showKpiList(\'پوشش < زمان تأمین\',TIPS.shortCover,shortC)"><div class="l">'+tip("پوشش کمتر از زمان تأمین","shortCover")+'</div><div class="v">'+shortC.length+'</div><div class="go">لیست ←</div></div></div>'+
    '<div class="panel"><div class="st"><span><span class="dot"></span> اتمام ≤۱۴ روز</span></div>'+(d14.length?d14.sort(function(a,b){return a.dts-b.dts}).map(function(i){return actHtml(Object.assign({},i,{_p:10,_problem:"DTS "+Math.round(i.dts),_action:i.qty?("سفارش "+fmt(Math.round(i.qty))):"پایش"}))}):'<div class="empty">—</div>')+"</div>";
}

function updatePill(){var el=document.getElementById("syncPill"),h=hoursAgo(GEN);if(!LIVE){el.className="pill n";el.textContent="داده نمونه";return}if(h!=null&&h>2){el.className="pill o";el.textContent="داده قدیمی";return}el.className="pill g";el.textContent="زنده"}

function renderAll(){
  renderTabs();updatePill();
  var list=filtered();
  var map={today:viewToday,plan30:viewPlan30,health:viewHealth,items:viewItems,overview:viewOverviewMgmt,finance:viewFinance,suppliers:viewSuppliers,strategy:viewStrategy,settings:viewSettings};
  document.getElementById("view").innerHTML=(map[TAB]||viewToday)(list);
  if(TAB==="settings")Array.prototype.forEach.call(document.querySelectorAll(".theme-opt"),function(b){b.onclick=function(){saveTheme(b.getAttribute("data-t"));renderAll()}});
  bindTips();
}
function bindTips(){
  Array.prototype.forEach.call(document.querySelectorAll(".has-tip"),function(el){
    el.onmouseenter=el.onclick=function(e){
      var box=document.getElementById("tipBox");box.textContent=el.getAttribute("data-tip")||"";box.classList.add("on");
      var r=el.getBoundingClientRect();box.style.left=Math.min(window.innerWidth-20,Math.max(10,r.left))+"px";
      box.style.top=(r.bottom+8)+"px";e.stopPropagation();
    };
  });
}
document.addEventListener("click",function(){document.getElementById("tipBox").classList.remove("on")});

function loadData(){
  LIVE=false;var i=0;
  function next(){
    if(i>=DATA_URLS.length){normalize(SAMPLE);document.getElementById("sampleBanner").classList.add("on");renderFilters();renderAll();return}
    var url=DATA_URLS[i++];
    fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("x");return r.json()}).then(function(raw){
      normalize(raw);LIVE=true;document.getElementById("sampleBanner").classList.remove("on");renderFilters();renderAll();
    }).catch(function(){next()});
  }
  next();
}

document.getElementById("btnLogout").onclick=function(){setAuthed(false);location.reload()};
document.getElementById("btnRefresh").onclick=loadData;
document.getElementById("btnSettings").onclick=function(){TAB="settings";renderAll()};
document.getElementById("drawerX").onclick=closeDrawer;document.getElementById("drawerBg").onclick=closeDrawer;
document.getElementById("kpiX").onclick=closeKpi;
document.getElementById("kpiModal").onclick=function(e){if(e.target.id==="kpiModal")closeKpi()};
document.getElementById("kpiPrint").onclick=function(){window.print()};
document.getElementById("modeSeg").onclick=function(e){
  var b=e.target.closest("button[data-m]");if(!b)return;MODE=b.getAttribute("data-m");TAB=tabsForMode()[0].id;
  Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"),function(x){x.classList.toggle("on",x.getAttribute("data-m")===MODE)});
  FILTERS={};renderFilters();renderAll();
};
window.isCritical=isCritical;window.isOrderToday=isOrderToday;window.isWarningOnly=isWarningOnly;window.filtered=filtered;window.TIPS=TIPS;

if(isAuthed()){
  try{MODE=sessionStorage.getItem(LS_MODE)||"ops"}catch(e){}
  document.getElementById("lock").classList.add("hid");document.getElementById("app").classList.add("on");
  Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"),function(x){x.classList.toggle("on",x.getAttribute("data-m")===MODE)});
  loadData();
}
})();
</script>
</body>
