<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2744">
<title>سامانه هوشمند موجودی — پتروشیمی آبادان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6;--card:#fff;--bd:#dfe5eb;--tx:#17212b;--mu:#6b7785;
  --navy:#0f2744;--blue:#2477b9;--red:#c53b3b;--org:#d9822b;--grn:#2d8a57;--yel:#c79a16;
  --radius:12px;--shadow:0 4px 16px rgba(15,39,68,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---- Lock screen ---- */
#lock{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#0a1a2e 0%,#0f2744 45%,#163a5f 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#lock.hid{display:none}
.lock-box{
  background:#fff;border-radius:16px;padding:28px 24px;width:min(360px,100%);
  box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;
}
.lock-box img{width:72px;height:72px;border-radius:50%;margin-bottom:12px;object-fit:cover}
.lock-box h1{font-size:16px;margin-bottom:4px;color:var(--navy)}
.lock-box p{font-size:12px;color:var(--mu);margin-bottom:16px}
.lock-box input{
  width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;
  text-align:center;letter-spacing:1px;margin-bottom:10px;font-size:15px;
}
.lock-box input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.lock-box .go{
  width:100%;padding:12px;border-radius:10px;background:var(--navy);color:#fff;
  font-weight:700;font-size:14px;
}
.lock-box .go:hover{background:#163a5f}
.lock-err{color:var(--red);font-size:12px;min-height:18px;margin-bottom:6px}

/* ---- App ---- */
#app{display:none}
#app.on{display:block}

.top{
  background:linear-gradient(135deg,#0a1a2e,#0f2744 50%,#1a4a7a);
  color:#fff;padding:10px 16px;position:sticky;top:0;z-index:40;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.top-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.brand h1{font-size:14px;font-weight:800}
.brand small{display:block;font-size:10px;color:#9bb0c7}
.pill{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700}
.pill.g{background:#d9f2e3;color:#1d6b40}
.pill.n{background:#dde5ec;color:#44515e}
.pill.o{background:#ffe6cc;color:#94510f}
.btn{
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:#a9bccd}
.seg button.on{background:#2c74b3;color:#fff}

.tabs{
  background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:58px;z-index:30;
  overflow-x:auto;
}
.tabs-in{max-width:1400px;margin:0 auto;display:flex;padding:0 10px;gap:2px}
.tab{
  padding:11px 12px;font-size:12.5px;font-weight:500;color:var(--mu);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.tab .bdg{background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-right:4px}

.main{max-width:1400px;margin:0 auto;padding:16px 14px 70px}
.filters{
  background:#fff;border:1px solid var(--bd);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.filters select,.filters input{
  padding:6px 8px;border:1px solid var(--bd);border-radius:8px;font-size:12px;background:#fff;min-width:110px;
}

.banner{border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;color:#fff;font-weight:700}
.banner.bad{background:linear-gradient(135deg,#c53b3b,#9f2d2d)}
.banner.warn{background:linear-gradient(135deg,#d9822b,#b86a1a)}
.banner.ok{background:linear-gradient(135deg,#2d8a57,#1f6b42)}
.banner small{display:block;font-weight:400;opacity:.9;margin-top:4px;font-size:12px}

.kpi-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-bottom:12px}
.kpi{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;
}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:#94a3b8}
.kpi.c::before{background:var(--red)}.kpi.h::before{background:var(--org)}.kpi.g::before{background:var(--grn)}.kpi.i::before{background:var(--blue)}
.kpi .l{font-size:11px;color:var(--mu)}.kpi .v{font-size:20px;font-weight:800;margin-top:2px}

.panel{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);margin-bottom:12px;
}
.st{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.st .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.two{grid-template-columns:1fr}.kpi-g{grid-template-columns:repeat(2,1fr)}}

.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.chip.c{background:#fde9e9;color:#a52f2f}.chip.h{background:#fff0df;color:#a65d13}
.chip.g{background:#e5f5ec;color:#237044}.chip.i{background:#e8f1fa;color:#1a5a8a}

.act{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff;
}
.act:hover{box-shadow:var(--shadow)}
.act.c{border-inline-start:3px solid var(--red);background:linear-gradient(90deg,#fde9e9,#fff 45%)}
.act.h{border-inline-start:3px solid var(--org);background:linear-gradient(90deg,#fff0df,#fff 45%)}
.prio{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
.act .nm{font-weight:700;font-size:13px}.act .mt{font-size:11.5px;color:var(--mu);margin-top:2px}
.days{font-weight:800;direction:ltr;text-align:left;font-size:13px}
.days.bad{color:var(--red)}.days.warn{color:var(--org)}

.tbl-w{overflow:auto;max-height:460px;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:#f4f7f9;padding:9px 10px;text-align:right;font-size:11px;color:#65717d;border-bottom:1px solid var(--bd);z-index:1}
td{padding:9px 10px;border-bottom:1px solid #edf0f3;vertical-align:middle}
tr:hover td{background:#f6fafd;cursor:pointer}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}

.bar-r{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px;cursor:pointer}
.bar-n{width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{flex:1;height:14px;background:#edf1f4;border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;min-width:3px}
.bar-f.r{background:var(--red)}.bar-f.o{background:var(--org)}.bar-f.g{background:var(--grn)}.bar-f.b{background:var(--blue)}

.gauge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto}
.gauge::after{content:'';position:absolute;inset:12px;border-radius:50%;background:#fff}
.gauge span{position:relative;z-index:1;font-weight:800;font-size:17px}

.drawer-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:80;display:none}
.drawer-bg.on{display:block}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:#fff;z-index:90;
  transform:translateX(-105%);transition:.25s;overflow-y:auto;padding:16px;box-shadow:var(--shadow);
}
.drawer.on{transform:translateX(0)}
.drawer h2{font-size:15px;margin-bottom:4px}
.drawer .sub{font-size:12px;color:var(--mu);margin-bottom:12px}
.df{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.df .f{background:#f8fafc;border-radius:8px;padding:8px}
.df .f .lb{font-size:10px;color:var(--mu)}.df .f .vl{font-size:13px;font-weight:600}

.empty{text-align:center;padding:24px;color:var(--mu)}
.msg{background:#fff8e8;border:1px solid #f0dca0;color:#8a5010;padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:10px}
.foot{text-align:center;color:var(--mu);font-size:11px;padding:12px}
.sample-banner{background:#fff3cd;color:#856404;padding:8px 14px;text-align:center;font-size:12.5px;font-weight:600;display:none}
</style>
</head>

/* ---- Auth ---- */
function isAuthed(){
  try{ return sessionStorage.getItem(LS_AUTH) === '1'; }catch(e){ return false; }
}
function setAuthed(v){
  try{ if(v) sessionStorage.setItem(LS_AUTH,'1'); else sessionStorage.removeItem(LS_AUTH); }catch(e){}
}
function tryUnlock(){
  const pin = document.getElementById('lockPin').value.trim();
  if(pin === ACCESS_CODE){
    setAuthed(true);
    document.getElementById('lock').classList.add('hid');
    document.getElementById('app').classList.add('on');
    loadData();
  } else {
    document.getElementById('lockErr').textContent = 'کد نادرست است';
    document.getElementById('lockPin').value = '';
    document.getElementById('lockPin').focus();
  }
}
document.getElementById('lockGo').onclick = tryUnlock;
document.getElementById('lockPin').onkeydown = e => { if(e.key==='Enter') tryUnlock(); };
document.getElementById('btnLogout').onclick = () => {
  setAuthed(false);
  location.reload();
};

/* ---- Utils ---- */
const n = v => (v==null||v===''||isNaN(Number(v))) ? 0 : Number(v);
const fmt = (v,d=0) => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
function toJalali(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    if(isNaN(d)) return String(iso).slice(0,16);
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }catch(e){ return String(iso).slice(0,10); }
}
function hoursAgo(iso){
  if(!iso) return null;
  const t = new Date(iso).getTime();
  if(isNaN(t)) return null;
  return (Date.now()-t)/3600000;
}

/* ---- State ---- */
let ITEMS=[], SUPPLIERS=[], VALUES=[], VALMAP={};
let LIVE=false, GEN=null, MODE='ops', TAB='today', FILTERS={};

function mapItem(r){
  return {
    code: r.ItemCode||'', name: r.ItemName||'—',
    cat: r.CategoryCode||'', sub: r.SubCategoryCode||'',
    crit: r.Criticality||'',
    stock: n(r.AvailableStock!=null?r.AvailableStock:r.TotalStock),
    totalStock: n(r.TotalStock), coverage: n(r.CoverageDays),
    dts: n(r.DaysToStockout), stockStatus: r.StockStatus||'GOOD',
    rec: r.OrderRecommendation||'OK', urgency: r.UrgencyLevel||'LOW',
    qty: n(r.SuggestedOrderQty), timing: r.OrderTimingStatus||'',
    gap: n(r.OrderTimingGap), health: r.InventoryHealthStatus||'HEALTHY',
    dead: !!(r.DeadStockFlag===true||r.DeadStockFlag===1||r.DeadStockFlag==='True'),
    slow: !!(r.SlowMovingFlag===true||r.SlowMovingFlag===1||r.SlowMovingFlag==='True'),
    action: !!(r.ActionFlag===true||r.ActionFlag===1),
    daily: n(r.AvgDailyDemand), monthly: n(r.AvgMonthlyDemand),
    safety: n(r.SafetyStock), reorder: n(r.ReorderPoint),
    avgLead: n(r.AvgLeadTime), forecast: r.ForecastStockoutDate||'',
    optimal: r.OptimalOrderDay||'',
    prefSup: r.PreferredSupplierCode||'', prefRisk: r.PreferredSupplierRiskLevel||'',
    priorityScore: n(r.PriorityScore), demandScore: n(r.DemandScore),
    loc: r.StorageLocation||''
  };
}
function mapSup(s){
  return {
    code: s.SupplierCode||'', name: s.SupplierName||'—', itemCode: s.ItemCode||'',
    deliveries: n(s.TotalDeliveries), late: n(s.LateDeliveries),
    avgDelay: n(s.AvgDelayDays), delayRate: n(s.DelayRate),
    risk: s.SupplierRiskLevel||'Low', preferred: !!(s.Preferred===true||s.Preferred===1)
  };
}
function mapVal(v){
  return {
    code: v.ItemCode||'', value: n(v.InventoryValue), turnover: n(v.TurnoverRatio),
    healthScore: n(v.HealthScore), overstock: !!(v.OverstockFlag===true||v.OverstockFlag===1||v.OverstockFlag==='TRUE')
  };
}

function normalize(raw){
  ITEMS = (raw.items||[]).map(mapItem).filter(i=>i.code);
  SUPPLIERS = (raw.suppliers||[]).map(mapSup).filter(s=>s.code);
  VALUES = (raw.values||[]).map(mapVal);
  VALMAP = {};
  VALUES.forEach(v=>{ if(v.code) VALMAP[v.code]=v; });
  GEN = raw.generated || raw.lastUpdated || null;
}

function filtered(){
  return ITEMS.filter(i=>{
    if(FILTERS.cat && i.cat!==FILTERS.cat) return false;
    if(FILTERS.crit && i.crit!==FILTERS.crit) return false;
    if(FILTERS.stock && i.stockStatus!==FILTERS.stock) return false;
    if(FILTERS.health && i.health!==FILTERS.health) return false;
    if(FILTERS.urg && i.urgency!==FILTERS.urg) return false;
    if(FILTERS.q){
      const q=FILTERS.q.toLowerCase();
      if(!(i.code+' '+i.name+' '+i.cat).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function uniq(a){ return [...new Set(a.filter(Boolean))].sort(); }

function labStatus(s){ return ({CRITICAL:'بحرانی',WARNING:'هشدار',GOOD:'سالم'})[s]||s||'—'; }
function labUrg(u){ return ({HIGH:'بالا',MEDIUM:'متوسط',LOW:'پایین'})[u]||u||'—'; }
function labHealth(h){ return ({HEALTHY:'سالم',SLOW:'کم‌گردش',DEAD:'راکد'})[h]||h||'—'; }
function sev(s){
  s=String(s||'').toUpperCase();
  if(/CRIT|HIGH|DEAD/.test(s)) return 'c';
  if(/WARN|MED|SLOW/.test(s)) return 'h';
  if(/GOOD|HEALTHY|LOW/.test(s)) return 'g';
  return 'i';
}

function actionPriority(i){
  let base=50;
  if(i.rec==='ORDER'||i.action||i.stockStatus==='CRITICAL') base=10;
  else if(i.urgency==='HIGH'||String(i.timing).toUpperCase().includes('ORDER NOW')) base=18;
  else if(i.dts>0 && i.dts<=30) base=30;
  else if(i.stockStatus==='WARNING') base=40;
  else return 999;
  const cw = i.crit==='A'?0:i.crit==='B'?6:14;
  return base + cw + Math.min(i.dts||99,60)/10;
}
function buildActions(list){
  const out=[];
  list.forEach(i=>{
    const p=actionPriority(i);
    if(p>=999) return;
    let problem='نیاز به بررسی', action='پیگیری';
    if(i.rec==='ORDER'||i.action||i.stockStatus==='CRITICAL'){
      problem='موجودی بحرانی / نیاز به سفارش'; action='صدور سفارش '+fmt(Math.round(i.qty))+' واحد';
    } else if(String(i.timing).toUpperCase().includes('ORDER NOW')){
      problem='سفارش همین حالا'; action='سفارش فوری';
    } else if(i.urgency==='HIGH'){
      problem='فوریت بالا'; action='اولویت تأمین';
    } else if(i.dts>0 && i.dts<=30){
      problem='اتمام طی '+Math.round(i.dts)+' روز'; action='برنامه‌ریزی سفارش';
    } else if(i.stockStatus==='WARNING'){
      problem='موجودی در هشدار'; action='بررسی نقطه سفارش';
    }
    out.push({...i,_p:p,_problem:problem,_action:action});
  });
  out.sort((a,b)=>a._p-b._p||a.dts-b.dts);
  return out;
}

/* ---- Drawer ---- */
function openItem(code){
  const i=ITEMS.find(x=>x.code===code); if(!i) return;
  const v=VALMAP[code];
  document.getElementById('dTitle').textContent=i.name;
  document.getElementById('dSub').textContent=`${i.code} · ${i.cat||''}${i.sub?' / '+i.sub:''}`;
  const f=(l,val)=>`<div class="f"><div class="lb">${l}</div><div class="vl">${val}</div></div>`;
  document.getElementById('dBody').innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <span class="chip ${sev(i.stockStatus)}">${labStatus(i.stockStatus)}</span>
      <span class="chip ${sev(i.urgency)}">فوریت ${labUrg(i.urgency)}</span>
      <span class="chip ${sev(i.health)}">${labHealth(i.health)}</span>
      <span class="chip i">بحرانیت ${i.crit||'—'}</span>
    </div>
    <div class="df">
      ${f('موجودی قابل استفاده',fmt(Math.round(i.stock)))}
      ${f('نقطه سفارش',fmt(Math.round(i.reorder)))}
      ${f('پوشش (روز)',fmt(i.coverage,0))}
      ${f('روز تا اتمام',fmt(i.dts,1))}
      ${f('مصرف روزانه',fmt(i.daily,2))}
      ${f('سفارش پیشنهادی',fmt(Math.round(i.qty)))}
      ${f('Lead Time',fmt(i.avgLead,1)+' روز')}
      ${f('تأمین‌کننده',i.prefSup||'—')}
      ${f('ریسک تأمین',i.prefRisk||'—')}
      ${f('تاریخ اتمام',toJalali(i.forecast))}
      ${v?f('ارزش موجودی',fmt(Math.round(v.value))):''}
      ${v?f('HealthScore',fmt(v.healthScore,0)):''}
    </div>`;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('drawerBg').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawerBg').classList.remove('on');
}
document.getElementById('drawerX').onclick=closeDrawer;
document.getElementById('drawerBg').onclick=closeDrawer;

/* ---- Views ---- */
function renderFilters(){
  const cats=uniq(ITEMS.map(i=>i.cat));
  document.getElementById('filters').innerHTML=`
    <input id="fq" placeholder="جستجو..." value="${FILTERS.q||''}" style="min-width:130px">
    <select id="fcat"><option value="">دسته</option>${cats.map(c=>`<option ${FILTERS.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select id="fcrit"><option value="">بحرانیت</option><option>A</option><option>B</option><option>C</option></select>
    <select id="fstock"><option value="">وضعیت</option><option>CRITICAL</option><option>WARNING</option><option>GOOD</option></select>
    <select id="fhealth"><option value="">سلامت</option><option>HEALTHY</option><option>SLOW</option><option>DEAD</option></select>
    <button type="button" class="btn" style="background:#eef2f6;color:var(--tx);border:1px solid var(--bd)" id="fclear">پاک فیلتر</button>`;
  const bind=()=>{
    FILTERS.q=document.getElementById('fq').value.trim();
    FILTERS.cat=document.getElementById('fcat').value;
    FILTERS.crit=document.getElementById('fcrit').value;
    FILTERS.stock=document.getElementById('fstock').value;
    FILTERS.health=document.getElementById('fhealth').value;
    renderAll();
  };
  ['fq','fcat','fcrit','fstock','fhealth'].forEach(id=>{
    const e=document.getElementById(id); if(!e)return;
    if(id!=='fq' && FILTERS[{fcat:'cat',fcrit:'crit',fstock:'stock',fhealth:'health'}[id]])
      e.value=FILTERS[{fcat:'cat',fcrit:'crit',fstock:'stock',fhealth:'health'}[id]];
    e.onchange=e.oninput=bind;
  });
  document.getElementById('fclear').onclick=()=>{ FILTERS={}; renderFilters(); renderAll(); };
}

const TABS=[
  {id:'today',label:'امروز'},
  {id:'overview',label:'نمای کلی'},
  {id:'actions',label:'اقدامات'},
  {id:'health',label:'سلامت'},
  {id:'forecast',label:'پیش‌بینی'},
  {id:'suppliers',label:'تأمین‌کنندگان'},
  {id:'items',label:'کالاها'},
  {id:'settings',label:'تنظیمات'}
];

function renderTabs(){
  const acts=buildActions(filtered()).length;
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<button type="button" class="tab ${TAB===t.id?'on':''}" data-t="${t.id}">${t.label}${t.id==='actions'&&acts?`<span class="bdg">${acts}</span>`:''}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick=()=>{ TAB=b.dataset.t; renderAll(); window.scrollTo({top:0}); };
  });
}

function actHtml(a){
  const sc=a._p<20?'c':a._p<35?'h':'';
  const col=a._p<20?'var(--red)':a._p<35?'var(--org)':'var(--blue)';
  const dc=a.dts<=7?'bad':a.dts<=30?'warn':'';
  return `<div class="act ${sc}" onclick="openItem('${a.code}')">
    <div class="prio" style="background:${col}22;color:${col}">${a.crit||'·'}</div>
    <div><div class="nm">${a.name} <span style="color:var(--mu);font-size:11px">(${a.code})</span></div>
    <div class="mt">${a._problem} → <b>${a._action}</b></div></div>
    <div class="days ${dc}">${a.dts?Math.round(a.dts)+' روز':'—'}</div></div>`;
}

function viewToday(list){
  const acts=buildActions(list);
  const must=acts.filter(a=>a._p<25).slice(0,6);
  const crit=list.filter(i=>i.stockStatus==='CRITICAL').length;
  let cls='ok', txt='وضعیت پایدار است';
  if(crit>=2||must.length>=3){ cls='bad'; txt=`${crit} قلم بحرانی — ${must.length} اقدام فوری`; }
  else if(crit||must.length){ cls='warn'; txt=`${crit} بحرانی — ${must.length} نیازمند اقدام`; }
  return `<div class="banner ${cls}">${txt}<small>آخرین همگام‌سازی: ${toJalali(GEN)} · ${GEN?new Date(GEN).toLocaleTimeString('fa-IR'):'—'}</small></div>
    <div class="panel"><div class="st"><span class="dot"></span> اگر امروز انجام نشود فردا دیر است</div>
      ${must.length?must.map(actHtml).join(''):'<div class="empty">مورد فوری نیست</div>'}</div>`;
}

function viewOverview(list){
  const total=list.length;
  const crit=list.filter(i=>i.stockStatus==='CRITICAL').length;
  const order=list.filter(i=>i.rec==='ORDER'||i.action).length;
  const dead=list.filter(i=>i.dead||i.health==='DEAD').length;
  const slow=list.filter(i=>i.slow||i.health==='SLOW').length;
  const healthy=list.filter(i=>i.health==='HEALTHY').length;
  const pct=total?Math.round(healthy/total*100):0;
  const riskSup=uniq(list.filter(i=>/high|crit/i.test(i.prefRisk)).map(i=>i.prefSup)).length;
  let fin='';
  if(MODE==='mgmt'){
    if(!VALUES.length) fin=`<div class="msg">جدول values در JSON نیست — ارزش مالی پس از export کامل فعال می‌شود.</div>`;
    else {
      const tv=list.reduce((s,i)=>s+(VALMAP[i.code]?.value||0),0);
      fin=`<div class="kpi-g">
        <div class="kpi i"><div class="l">ارزش کل موجودی</div><div class="v">${fmt(Math.round(tv/1e6),1)}M</div></div>
        <div class="kpi h"><div class="l">تعداد با values</div><div class="v">${VALUES.length}</div></div>
      </div>`;
    }
  }
  const st={}; list.forEach(i=>{st[i.stockStatus]=(st[i.stockStatus]||0)+1});
  const maxs=Math.max(...Object.values(st),1);
  return `${fin}
    <div class="kpi-g">
      <div class="kpi i"><div class="l">کل کالاها</div><div class="v">${total}</div></div>
      <div class="kpi c" onclick="FILTERS.stock='CRITICAL';renderFilters();TAB='actions';renderAll()"><div class="l">بحرانی</div><div class="v">${crit}</div></div>
      <div class="kpi h" onclick="TAB='actions';renderAll()"><div class="l">نیازمند سفارش</div><div class="v">${order}</div></div>
      <div class="kpi h"><div class="l">راکد / کم‌گردش</div><div class="v">${dead+slow}</div></div>
      <div class="kpi c"><div class="l">تأمین پرریسک</div><div class="v">${riskSup}</div></div>
    </div>
    <div class="two">
      <div class="panel"><div class="st"><span class="dot"></span> سلامت (٪ سالم)</div>
        <div class="gauge" style="background:conic-gradient(${pct>=70?'var(--grn)':pct>=40?'var(--yel)':'var(--red)'} ${pct*3.6}deg,#e2e8f0 0)"><span>${pct}٪</span></div>
        <div style="text-align:center;margin-top:8px;font-size:12px;color:var(--mu)">${healthy} از ${total}</div>
      </div>
      <div class="panel"><div class="st"><span class="dot"></span> توزیع وضعیت</div>
        ${['CRITICAL','WARNING','GOOD'].map(k=>`<div class="bar-r" onclick="FILTERS.stock='${k}';renderFilters();renderAll()">
          <div class="bar-n">${labStatus(k)}</div><div class="bar-t"><div class="bar-f ${k==='CRITICAL'?'r':k==='WARNING'?'o':'g'}" style="width:${((st[k]||0)/maxs)*100}%"></div></div><b>${st[k]||0}</b></div>`).join('')}
      </div>
    </div>`;
}

function viewActions(list){
  const acts=buildActions(list);
  return `<div class="panel"><div class="st"><span class="dot"></span> لیست اقدامات (${acts.length})</div>
    <div class="tbl-w"><table>
      <thead><tr><th>اولویت</th><th>کالا</th><th>مشکل</th><th>اقدام</th><th>روز تا اتمام</th><th>مقدار</th></tr></thead>
      <tbody>${acts.map(a=>`<tr onclick="openItem('${a.code}')">
        <td><span class="chip ${a._p<20?'c':a._p<35?'h':'i'}">${a.crit||'—'} ${a._p<20?'🔴':a._p<35?'🟠':'🟡'}</span></td>
        <td><b>${a.name}</b><div style="font-size:10px;color:var(--mu)">${a.code}</div></td>
        <td>${a._problem}</td><td>${a._action}</td>
        <td class="num" style="font-weight:700;color:${a.dts<=7?'var(--red)':''}">${fmt(a.dts,1)}</td>
        <td class="num">${fmt(Math.round(a.qty))}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">اقدامی نیست</td></tr>'}
      </tbody></table></div></div>`;
}

function viewHealth(list){
  const healthy=list.filter(i=>i.health==='HEALTHY').length;
  const pct=list.length?Math.round(healthy/list.length*100):0;
  const byCat={}; list.forEach(i=>{byCat[i.cat||'سایر']=(byCat[i.cat||'سایر']||0)+1});
  const maxc=Math.max(...Object.values(byCat),1);
  return `<div class="two">
    <div class="panel"><div class="st"><span class="dot"></span> سلامت کلی</div>
      <div class="gauge" style="background:conic-gradient(${pct>=70?'var(--grn)':pct>=40?'var(--yel)':'var(--red)'} ${pct*3.6}deg,#e2e8f0 0)"><span>${pct}٪</span></div></div>
    <div class="panel"><div class="st"><span class="dot"></span> بر اساس دسته</div>
      ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-r" onclick="FILTERS.cat='${k}';renderFilters();renderAll()">
        <div class="bar-n">${k}</div><div class="bar-t"><div class="bar-f b" style="width:${(v/maxc)*100}%"></div></div><b>${v}</b></div>`).join('')}
    </div></div>`;
}

function viewForecast(list){
  const sorted=[...list].sort((a,b)=>(a.dts||999)-(b.dts||999));
  return `<div class="panel"><div class="tbl-w"><table>
    <thead><tr><th>کالا</th><th>روز تا اتمام</th><th>پوشش</th><th>سفارش</th><th>زمان‌بندی</th></tr></thead>
    <tbody>${sorted.map(i=>`<tr onclick="openItem('${i.code}')">
      <td><b>${i.name}</b><div style="font-size:10px;color:var(--mu)">${i.code}</div></td>
      <td class="num" style="font-weight:700;color:${i.dts<=7?'var(--red)':i.dts<=30?'var(--org)':''}">${fmt(i.dts,1)}</td>
      <td class="num">${fmt(i.coverage,0)}</td>
      <td class="num">${fmt(Math.round(i.qty))}</td>
      <td><span class="chip ${sev(i.timing)}">${i.timing||'—'}</span></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function viewSuppliers(list){
  const codes=new Set(list.map(i=>i.code));
  const map={};
  SUPPLIERS.filter(s=>!s.itemCode||codes.has(s.itemCode)).forEach(s=>{
    if(!map[s.code]) map[s.code]={...s,items:new Set()};
    map[s.code].items.add(s.itemCode);
    if(s.delayRate>map[s.code].delayRate){ map[s.code].delayRate=s.delayRate; map[s.code].avgDelay=s.avgDelay; map[s.code].risk=s.risk; }
  });
  const arr=Object.values(map).map(s=>({...s,n:s.items.size})).sort((a,b)=>b.delayRate-a.delayRate);
  const high=arr.filter(s=>/high|crit/i.test(s.risk)).length;
  return `<div class="kpi-g">
      <div class="kpi i"><div class="l">تأمین‌کنندگان</div><div class="v">${arr.length}</div></div>
      <div class="kpi c"><div class="l">پرریسک</div><div class="v">${high}</div></div>
    </div>
    <div class="panel"><div class="tbl-w"><table>
      <thead><tr><th>تأمین‌کننده</th><th>تأخیر٪</th><th>میانگین تأخیر</th><th>ریسک</th><th>کالاها</th></tr></thead>
      <tbody>${arr.map(s=>`<tr>
        <td><b>${s.name}</b><div style="font-size:10px;color:var(--mu)">${s.code}</div></td>
        <td class="num">${fmt(s.delayRate*100,0)}٪</td>
        <td class="num">${fmt(s.avgDelay,1)}</td>
        <td><span class="chip ${sev(s.risk)}">${s.risk}</span></td>
        <td class="num">${s.n}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">—</td></tr>'}
      </tbody></table></div></div>`;
}

function viewItems(list){
  return `<div class="panel"><div class="tbl-w"><table>
    <thead><tr><th>کالا</th><th>دسته</th><th>موجودی</th><th>مصرف روزانه</th><th>وضعیت</th></tr></thead>
    <tbody>${list.map(i=>`<tr onclick="openItem('${i.code}')">
      <td><b>${i.name}</b><div style="font-size:10px;color:var(--mu)">${i.code}</div></td>
      <td>${i.cat||'—'}</td>
      <td class="num">${fmt(Math.round(i.stock))}</td>
      <td class="num">${fmt(i.daily,2)}</td>
      <td><span class="chip ${sev(i.stockStatus)}">${labStatus(i.stockStatus)}</span></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function viewSettings(){
  const h=hoursAgo(GEN);
  return `<div class="panel"><div class="st"><span class="dot"></span> منبع داده</div>
    <div style="font-size:13px;line-height:1.9">
      وضعیت: <b>${LIVE?'🟢 زنده':'🟠 نمونه'}</b><br>
      آخرین sync: ${GEN||'—'} (${toJalali(GEN)}) ${h!=null?`· ${h<1?Math.round(h*60)+' دقیقه':Math.round(h)+' ساعت'} پیش`:''}<br>
      کالاها: ${ITEMS.length} · تأمین‌کنندگان: ${SUPPLIERS.length} · values: ${VALUES.length}<br>
      مسیر: <code dir="ltr">data/dashboard.json</code>
    </div>
    ${!LIVE?`<div class="msg" style="margin-top:10px">اگر همیشه نمونه است: فایل JSON را در GitHub در مسیر data/dashboard.json قرار دهید و Pages را روشن کنید.</div>`:''}
  </div>`;
}

function updatePill(){
  const el=document.getElementById('syncPill');
  const h=hoursAgo(GEN);
  if(!LIVE){ el.className='pill n'; el.textContent='داده نمونه'; return; }
  if(h!=null && h>2){ el.className='pill o'; el.textContent='داده قدیمی · '+Math.round(h)+'س'; return; }
  el.className='pill g';
  el.textContent='زنده'+(h!=null?(h<1?' · '+Math.round(h*60)+'د':' · '+Math.round(h)+'س'):'');
}

function renderAll(){
  renderTabs();
  updatePill();
  const list=filtered();
  const map={
    today:viewToday, overview:viewOverview, actions:viewActions,
    health:viewHealth, forecast:viewForecast, suppliers:viewSuppliers,
    items:viewItems, settings:viewSettings
  };
  document.getElementById('view').innerHTML=(map[TAB]||viewToday)(list);
}

async function loadData(){
  LIVE=false;
  for(const url of DATA_URLS){
    try{
      const res=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
      if(!res.ok) continue;
      const raw=await res.json();
      normalize(raw);
      LIVE=true;
      break;
    }catch(e){}
  }
  if(!LIVE) normalize(SAMPLE);
  document.getElementById('sampleBanner').style.display=LIVE?'none':'block';
  renderFilters();
  renderAll();
}

document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button[data-m]'); if(!b) return;
  MODE=b.dataset.m;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.m===MODE));
  renderAll();
};
document.getElementById('btnRefresh').onclick=loadData;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

if(isAuthed()){
  document.getElementById('lock').classList.add('hid');
  document.getElementById('app').classList.add('on');
  loadData();
} else {
  document.getElementById('lockPin').focus();
}
</script>
</body>
</html>
